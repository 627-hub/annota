name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  portable:
    name: Package extension and userscripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check tag version and build scripts
        run: |
          python - <<'PY'
          import json, os, sys
          version = json.load(open("app/annota/tauri.conf.json", encoding="utf-8"))["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match app version v{version}")
          PY
          python build.py
      - name: Guard browser-shell contract
        run: node dev/check-shell-drift.mjs
      - name: Package portable downloads
        shell: bash
        run: |
          mkdir -p release-assets
          cp dist/*.user.js release-assets/
          (cd app/extension && zip -q -r "../../release-assets/annota-extension-${RELEASE_TAG}.zip" manifest.json background.js core.js)
      - uses: actions/upload-artifact@v4
        with:
          name: portable-downloads
          path: release-assets/*
          if-no-files-found: error
          retention-days: 5

  desktop:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-latest
            bundle: dmg
            artifact: macos-dmg
            path: app/annota/target/release/bundle/dmg/*.dmg
          - name: Windows installer
            os: windows-latest
            bundle: nsis
            artifact: windows-installer
            path: app/annota/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag version and build scripts
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          version = json.load(open("app/annota/tauri.conf.json", encoding="utf-8"))["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match app version v{version}")
          PY
          python build.py
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.1 --locked
      - name: Detect Apple signing credentials
        id: apple-signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed macOS installer
        if: runner.os == 'macOS' && steps.apple-signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles ${{ matrix.bundle }}
        working-directory: app/annota
      - name: Build desktop installer
        if: runner.os != 'macOS' || steps.apple-signing.outputs.enabled != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles ${{ matrix.bundle }}
        working-directory: app/annota
      - name: Collect updater artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          # Tauri 更新包：.app.tar.gz + .sig（比 dmg 更适合增量覆盖安装）
          find app/annota/target/release/bundle/macos -name '*.app.tar.gz' -exec cp {} release-assets/ \;
          find app/annota/target/release/bundle/macos -name '*.app.tar.gz.sig' -exec cp {} release-assets/ \;
          ls -la release-assets/ || true
      - name: Collect updater artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release-assets
          find app/annota/target/release/bundle/nsis -name '*.exe.sig' -exec cp {} release-assets/ \;
          ls -la release-assets/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' || runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact }}-updater
          path: release-assets/*
          if-no-files-found: warning
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: [portable, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate updater latest.json
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python - <<'PY'
          import json, os, glob
          tag = os.environ["RELEASE_TAG"]
          version = json.load(open("app/annota/tauri.conf.json", encoding="utf-8"))["version"]
          base = f"https://github.com/627-hub/annota/releases/download/{tag}"
          files = os.listdir("release-assets")
          def sig_for(suffix):
              for f in files:
                  if f.endswith(suffix + ".sig"):
                      return open(os.path.join("release-assets", f), encoding="utf-8").read().strip()
              return None
          platforms = {}
          mac_tar = next((f for f in files if f.endswith(".app.tar.gz")), None)
          if mac_tar:
              # aarch64 与 x86_64 都指向同一产物（CI 只出一个 mac 包时）；有双包再细分
              platforms["darwin-aarch64"] = {"signature": sig_for(".app.tar.gz"), "url": f"{base}/{mac_tar}"}
              platforms["darwin-x86_64"] = platforms["darwin-aarch64"]
          win_sig = sig_for(".exe")
          win_exe = next((f for f in files if f.endswith(".exe") and not f.endswith(".sig")), None)
          if win_exe and win_sig:
              platforms["windows-x86_64"] = {"signature": win_sig, "url": f"{base}/{win_exe}"}
          out = {"version": version, "notes": f"Annota {tag}", "pub_date": "2026-01-01T00:00:00Z", "platforms": platforms}
          open("release-assets/latest.json", "w", encoding="utf-8").write(json.dumps(out, ensure_ascii=False, indent=2))
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
      # 把 latest.json 推到 CloudBase 静态托管（应用内 updater 的 endpoint）
      # 条件：配置了 TCB_ENV secret（用 job 级 env 判断，避免 step env 自引用）
      - name: Publish updater manifest to CloudBase
        env:
          TCB_ENV: ${{ secrets.TCB_ENV }}
        shell: bash
        run: |
          if [ -z "$TCB_ENV" ]; then echo "TCB_ENV 未配置，跳过 updater manifest 上传"; exit 0; fi
          npm i -g @cloudbase/cli@latest
          tcb hosting deploy release-assets/latest.json app/latest.json -e "$TCB_ENV"
