name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quick:
    name: Quick check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 构建产物（build.py）
        run: python3 build.py

      - name: Rust 单测 + 集成测试
        working-directory: app/annota
        run: cargo test

      - name: Rust 编译检查
        working-directory: app/annota
        run: cargo check

      - name: 权限自检（Tauri 命令 ↔ permissions/*.toml）
        run: node dev/check-tauri-permissions.mjs

      - name: 版本一致性（Cargo.toml ↔ tauri.conf.json）
        run: node dev/check-version.mjs

      - name: Shell 漂移检查
        run: node dev/check-shell-drift.mjs

      - name: JS 单测
        run: |
          for t in dev/*.test.mjs; do echo "== $t"; node "$t"; done

      - name: Python 单测
        run: |
          for t in dev/*.test.py; do echo "== $t"; python3 "$t"; done

      - name: smoke（HTML 内联脚本语法 + 基础行为）
        run: |
          for t in dev/smoke*.mjs; do echo "== $t"; node "$t"; done

  full:
    name: Full build + integration
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 构建产物（build.py）
        run: python3 build.py

      - name: Rust 全量测试
        working-directory: app/annota
        run: cargo test

      - name: Rust debug 构建
        working-directory: app/annota
        run: cargo build

      - name: Rust release 构建
        working-directory: app/annota
        run: cargo build --release
