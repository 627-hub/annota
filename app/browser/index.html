<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>video-annotate 浏览器</title>
<style>
  :root{--bg:#0b0e13;--ink:#e6edf3;--dim:#8b949e;--accent:#f0b429;--line:#222a34}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC",sans-serif}
  #bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#131820;border-bottom:1px solid var(--line)}
  #bar button{background:#1d242e;border:1px solid #2c3540;color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer;font:inherit}
  #bar button:hover{border-color:var(--accent);color:var(--accent)}
  #url{flex:1;background:#0e131a;border:1px solid #2b3644;color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}
  #bar .q{color:#9ecbff}
  #wrap{position:relative;height:calc(100% - 53px)}
  #viewhost{position:absolute;left:0;top:0;right:0;bottom:0}
  webview{width:100%;height:100%;display:flex;background:#000}
  #home{position:absolute;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 50% -10%,#16202b,#0b0e13)}
  .card{max-width:720px;margin:9vh auto 40px;padding:0 24px}
  h1{font-size:26px;color:var(--accent);margin:0 0 6px}
  .sub{color:var(--dim);margin-bottom:22px}
  .grid{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 8px}
  .tile{flex:1;min-width:170px;background:#11161d;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
  .tile:hover{border-color:var(--accent)}
  .tile b{display:block;font-size:15px;margin-bottom:4px}
  .tile span{color:var(--dim);font-size:12.5px}
  ol{color:#c9d1d9}code{color:#9ecbff}
  .tip{margin-top:18px;background:#11161d;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:#c9d1d9}
</style>
</head>
<body>
<div id="bar">
  <button id="back" title="后退">←</button>
  <button id="fwd" title="前进">→</button>
  <button id="reload" title="刷新">⟳</button>
  <input id="url" placeholder="粘贴 B站 / 抖音 / YouTube 视频链接，回车打开" spellcheck="false">
  <button id="go">打开</button>
  <button class="q" data-u="https://www.bilibili.com">B站</button>
  <button class="q" data-u="https://www.douyin.com">抖音</button>
  <button class="q" data-u="https://www.youtube.com">YouTube</button>
</div>
<div id="wrap">
  <div id="viewhost"></div>
  <div id="home">
    <div class="card">
      <h1>video-annotate · 标注浏览器</h1>
      <div class="sub">打开任意视频，边看边标：拖框圈出画面里的词，自动带出中英释义与词性，一键共享。</div>
      <div class="grid">
        <div class="tile" data-u="https://www.bilibili.com"><b>B站</b><span>www.bilibili.com</span></div>
        <div class="tile" data-u="https://www.douyin.com"><b>抖音</b><span>www.douyin.com</span></div>
        <div class="tile" data-u="https://www.youtube.com"><b>YouTube</b><span>www.youtube.com</span></div>
      </div>
      <ol>
        <li>在地址栏粘贴视频链接，回车打开。</li>
        <li>画面右下角点「标注」，框住画面里的事物，输入中/英文即可联想选词。</li>
        <li>标注会自动保存并同步——别人打开同一视频就能看到。</li>
      </ol>
      <div class="tip">适用于：英语 / 小语种情境学习、视频内容标注。标注为纯文本，可导出、可共享。</div>
    </div>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
