<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Annota Overlay</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; background:transparent; overflow:hidden; }
    body {
      color:var(--va-text); font:13px/1.4 var(--va-font-ui);
      -webkit-font-smoothing:antialiased; user-select:none;
    }
    /* 透明遮罩：吃掉浮层内的点击，避免穿透到页面 */
    .backdrop { position:fixed; inset:0; background:transparent; }

    /* ============ 菜单（M7：固定宽度，锚在「更多」下方） ============ */
    .menu {
      position:absolute; top:0; left:0; width:100%; padding:6px;
      border:1px solid rgba(255,255,255,.1); border-radius:12px; background:#1a1b1f;
      box-shadow:0 16px 44px rgba(0,0,0,.5); display:none; flex-direction:column; gap:1px;
    }
    .menu[data-open="1"] { display:flex; }
    .menu button {
      display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border:0; border-radius:8px;
      background:transparent; color:#cfd3d9; font:12px var(--va-font-ui); text-align:left; cursor:pointer;
    }
    .menu button:hover { background:rgba(255,255,255,.07); }
    .menu .menu-sep { height:1px; margin:5px 4px; background:rgba(255,255,255,.08); }
    .menu .menu-hint { padding:4px 10px 2px; color:#727781; font-size:9px; font-weight:700; letter-spacing:.1em; }
    .zoom-row { display:flex; align-items:center; gap:4px; padding:2px 6px 4px; }
    .zoom-btn {
      display:grid; place-items:center; height:28px; flex:1; padding:0; border:0; border-radius:7px;
      background:rgba(255,255,255,.04); color:#cfd3d9; cursor:pointer;
    }
    .zoom-btn:hover { background:rgba(255,255,255,.09); color:#f1f2f3; }
    .zoom-btn svg { width:14px; height:14px; }
    .zoom-btn--wide { font:600 11px var(--va-font-mono); }

    /* ============ 面板（历史 / 下载）：铺满剩余高度 ============ */
    .chrome-panel {
      position:absolute; inset:0; display:none; flex-direction:column; background:#17181c;
      border-top:1px solid rgba(255,255,255,.09); box-shadow:0 -18px 44px rgba(0,0,0,.42);
    }
    .chrome-panel[data-open="1"] { display:flex; }
    .chrome-panel-head { display:flex; align-items:center; gap:10px; flex:none; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.07); }
    .chrome-panel-title { color:#f0f1f3; font-size:13px; font-weight:680; }
    .chrome-panel-count { color:#727781; font-size:11px; }
    .chrome-panel-spacer { flex:1; }
    .chrome-panel-btn {
      display:inline-flex; align-items:center; height:28px; padding:0 11px; border:1px solid rgba(255,255,255,.1);
      border-radius:8px; background:rgba(255,255,255,.03); color:#cfd3d9; font:12px var(--va-font-ui); cursor:pointer;
    }
    .chrome-panel-btn:hover { background:rgba(255,255,255,.08); color:#f1f2f3; }
    .chrome-panel-btn.danger:hover { border-color:rgba(239,115,121,.5); color:#ef7379; }
    .chrome-panel-list { flex:1; overflow:auto; padding:6px; }
    .chrome-item { display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px; cursor:pointer; }
    .chrome-item:hover { background:rgba(255,255,255,.06); }
    .chrome-item-main { flex:1; min-width:0; }
    .chrome-item-title { color:#e7e9ec; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chrome-item-sub { margin-top:2px; color:#7c828b; font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chrome-item-time { flex:none; color:#727781; font-size:10.5px; }
    .chrome-badge { display:inline-flex; align-items:center; flex:none; height:20px; padding:0 8px; border-radius:999px; font:600 10px var(--va-font-ui); }
    .chrome-badge.done { color:#7fe0b0; background:rgba(73,188,134,.14); }
    .chrome-badge.downloading { color:#f5c66a; background:rgba(245,166,35,.14); }
    .chrome-badge.failed { color:#ef9a9e; background:rgba(239,115,121,.14); }
    .chrome-empty { padding:46px 16px; text-align:center; color:#727781; font-size:12px; }
    /* 轻量 toast（P1-b#12）：浮层内右下角 */
    .toast-stack { position:fixed; right:8px; bottom:8px; z-index:var(--va-z-toast); display:flex; flex-direction:column; align-items:flex-end; gap:6px; max-width:calc(100% - 16px); pointer-events:none; }
    .toast { max-width:100%; padding:6px 10px; border:1px solid rgba(255,255,255,.1); border-left:3px solid var(--va-warning); border-radius:8px; background:#1e1f24; color:#e7e9ec; font:11.5px/1.45 var(--va-font-ui); box-shadow:0 8px 24px rgba(0,0,0,.4); overflow-wrap:anywhere; user-select:text; }
    .toast[data-leaving="1"] { opacity:0; transition:opacity 200ms ease; }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <!-- 菜单 -->
  <div class="menu" id="menu" role="menu">
    <div class="menu-hint">工具</div>
    <button data-cmd="history" role="menuitem">历史记录</button>
    <button data-cmd="downloads" role="menuitem">下载</button>
    <button data-cmd="no-restore" role="menuitem">不恢复上次会话</button>
    <button data-cmd="workspace" role="menuitem">打开工作区</button>
    <div class="menu-sep"></div>
    <div class="menu-hint">缩放</div>
    <div class="zoom-row">
      <button class="zoom-btn" data-zoom="out" role="menuitem" aria-label="缩小" title="缩小 (⌘−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg></button>
      <button class="zoom-btn zoom-btn--wide" data-zoom="reset" role="menuitem" title="重置缩放 (⌘0)"><span id="menu-zoom-label">100%</span></button>
      <button class="zoom-btn" data-zoom="in" role="menuitem" aria-label="放大" title="放大 (⌘+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg></button>
    </div>
    <div class="menu-sep"></div>
    <button data-cmd="devtools" role="menuitem">开发者工具</button>
    <button data-cmd="diag" role="menuitem">诊断信息</button>
  </div>

  <!-- 历史 / 下载面板（按需渲染内容） -->
  <div class="chrome-panel" id="chrome-panel" data-open="0"></div>

  <script>
    const API = 'http://127.0.0.1:8793';
    const WORKSPACE = 'http://127.0.0.1:8793/';
    function tauri() { return window.__TAURI_INTERNALS__ || window.__TAURI__; }
    function invoke(cmd, args) {
      const t = tauri();
      if (!t || !t.invoke) throw new Error('Annota bridge 不可用');
      return t.invoke(cmd, args);
    }
    const menu = document.getElementById('menu');
    const chromePanel = document.getElementById('chrome-panel');
    const backdrop = document.getElementById('backdrop');

    function closeMe() { invoke('overlay_close').catch(() => {}); }
    backdrop.addEventListener('click', closeMe);

    // Esc 关闭；点击菜单外（面板区）关闭
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMe(); });

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmtAgo(ms) {
      const d = Date.now() - ms;
      if (d < 60000) return '刚刚';
      const m = d / 60000; if (m < 60) return Math.floor(m) + ' 分钟前';
      const h = m / 60; if (h < 24) return Math.floor(h) + ' 小时前';
      const dd = h / 24; if (dd < 30) return Math.floor(dd) + ' 天前';
      try { return new Date(ms).toLocaleDateString(); } catch (e) { return ''; }
    }
    function fmtBytes(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + ' B';
      const u = ['KB', 'MB', 'GB', 'TB']; let i = -1;
      do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
      return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
    }

    // ---------- 缩放 ----------
    let zoomFactor = 1.0;
    try { zoomFactor = parseFloat(localStorage.getItem('va.browser.zoom')) || 1.0; } catch (e) {}
    function applyZoom() {
      invoke('set_zoom', { factor: zoomFactor }).catch(() => {});
      try { localStorage.setItem('va.browser.zoom', String(zoomFactor)); } catch (e) {}
      const label = document.getElementById('menu-zoom-label');
      if (label) label.textContent = Math.round(zoomFactor * 100) + '%';
    }
    function zoomBy(delta) { zoomFactor = Math.min(5.0, Math.max(0.25, +(zoomFactor + delta).toFixed(2))); applyZoom(); }
    menu.addEventListener('click', (e) => {
      const z = e.target && e.target.closest && e.target.closest('[data-zoom]');
      if (!z) return;
      e.stopPropagation();
      const kind = z.dataset.zoom;
      if (kind === 'in') zoomBy(0.1);
      else if (kind === 'out') zoomBy(-0.1);
      else { zoomFactor = 1.0; applyZoom(); }
    });
    applyZoom();

    // ---------- 菜单命令 ----------
    menu.addEventListener('click', (e) => {
      const cmd = e.target && e.target.dataset && e.target.dataset.cmd;
      if (!cmd) return;
      if (cmd === 'history' || cmd === 'downloads') { showPanel(cmd); return; }
      closeMe();
      if (cmd === 'workspace') invoke('navigate_browser', { url: WORKSPACE }).catch(() => {});
      else if (cmd === 'no-restore') invoke('tab_session_clear').catch(() => {});
      else if (cmd === 'devtools') invoke('open_devtools').catch(() => {});
      else if (cmd === 'diag') {
        let diag = { ok: true };
        invoke('tabs_snapshot').then((r) => { diag = r; }).catch(() => {})
          .finally(() => {
            const tabs = (diag && diag.tabs) || [];
            alert('Annota 诊断\n\n标签数：' + tabs.length +
              (tabs.length ? '\n活动标签：' + (tabs.find((t) => t.active) || {}).id : ''));
          });
      }
    });

    // ---------- 面板 ----------
    let panelKind = null;
    function panelHead(title, clearLabel) {
      return '<div class="chrome-panel-head"><span class="chrome-panel-title">' + esc(title) + '</span>' +
        '<span class="chrome-panel-count" id="panel-count"></span><span class="chrome-panel-spacer"></span>' +
        '<button class="chrome-panel-btn danger" id="panel-clear">' + esc(clearLabel) + '</button>' +
        '<button class="chrome-panel-btn" id="panel-close">关闭</button></div>' +
        '<div class="chrome-panel-list" id="panel-list"></div>';
    }
    function wirePanel(clearFn) {
      const close = document.getElementById('panel-close');
      if (close) close.addEventListener('click', closeMe);
      const clr = document.getElementById('panel-clear');
      if (clr) clr.addEventListener('click', clearFn);
    }
    function showPanel(kind) {
      panelKind = kind;
      menu.dataset.open = '0';
      chromePanel.dataset.open = '1';
      if (kind === 'history') renderHistory(); else renderDownloads();
    }
    async function renderHistory() {
      chromePanel.innerHTML = panelHead('历史记录', '清空历史');
      wirePanel(clearHistory);
      let rows = [];
      try { const r = await window.vaFetch('GET', API + '/api/history?limit=200'); rows = (r && r.ok && r.json && r.json.history) || []; } catch (e) {}
      if (panelKind !== 'history') return;
      const list = document.getElementById('panel-list'); if (!list) return;
      const cnt = document.getElementById('panel-count'); if (cnt) cnt.textContent = rows.length + ' 条';
      if (!rows.length) { list.innerHTML = '<div class="chrome-empty">暂无历史记录</div>'; return; }
      list.innerHTML = rows.map((it) =>
        '<div class="chrome-item" data-url="' + esc(it.url) + '"><div class="chrome-item-main">' +
        '<div class="chrome-item-title">' + esc(it.title || it.url) + '</div>' +
        '<div class="chrome-item-sub">' + esc(it.url) + '</div></div>' +
        '<div class="chrome-item-time">' + fmtAgo(it.visit_at) + '</div></div>').join('');
      list.querySelectorAll('.chrome-item').forEach((el) => el.addEventListener('click', () => {
        // 成功才收起浮层；失败留在面板上，让 toast 可见
        invoke('navigate_browser', { url: el.dataset.url }).then(
          () => closeMe(),
          (e) => { console.warn('[annota] 打开历史记录失败', e); toast('打开失败：' + reasonText(e)); }
        );
      }));
    }
    async function renderDownloads() {
      chromePanel.innerHTML = panelHead('下载', '清空记录');
      wirePanel(clearDownloads);
      let rows = [];
      try { const r = await window.vaFetch('GET', API + '/api/downloads'); rows = (r && r.ok && r.json && r.json.downloads) || []; } catch (e) {}
      if (panelKind !== 'downloads') return;
      const list = document.getElementById('panel-list'); if (!list) return;
      const cnt = document.getElementById('panel-count'); if (cnt) cnt.textContent = rows.length + ' 条';
      if (!rows.length) { list.innerHTML = '<div class="chrome-empty">暂无下载记录</div>'; return; }
      const label = { done: '已完成', downloading: '下载中', failed: '失败' };
      list.innerHTML = rows.map((it) =>
        '<div class="chrome-item" data-path="' + esc(it.path || '') + '" title="' + esc(it.path || it.url) + '"><div class="chrome-item-main">' +
        '<div class="chrome-item-title">' + esc(it.filename || it.url) + '</div>' +
        '<div class="chrome-item-sub">' + fmtBytes(it.size) + (it.path ? ' · ' + esc(it.path) : '') + '</div></div>' +
        '<span class="chrome-badge ' + esc(it.status) + '">' + esc(label[it.status] || it.status) + '</span>' +
        '<div class="chrome-item-time">' + fmtAgo(it.created_at) + '</div></div>').join('');
      list.querySelectorAll('.chrome-item').forEach((el) => el.addEventListener('click', () => {
        const p = el.dataset.path;
        if (p && window.__ANNOTA__ && window.__ANNOTA__.copyToClipboard) window.__ANNOTA__.copyToClipboard({ text: p }).catch(() => {});
      }));
    }
    // P1-b#12：清空失败不再静默，给出 toast（浮层内右下角，2-3 秒消失）
    function reasonText(e) {
      if (e == null) return '未知错误';
      if (typeof e === 'string') return e;
      if (e instanceof Error) return e.message || String(e);
      if (typeof e === 'object') {
        if (typeof e.message === 'string' && e.message) return e.message;
        if (typeof e.error === 'string' && e.error) return e.error;
        try { return JSON.stringify(e); } catch (x) { return String(e); }
      }
      return String(e);
    }
    function toast(msg) {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const el = document.createElement('div');
      el.className = 'toast'; el.dataset.kind = 'error'; el.setAttribute('role', 'alert');
      el.textContent = msg;
      stack.appendChild(el);
      while (stack.children.length > 2) stack.firstElementChild.remove();
      setTimeout(() => { el.dataset.leaving = '1'; setTimeout(() => el.remove(), 220); }, 3000);
    }
    async function clearHistory() {
      try { const r = await window.vaFetch('DELETE', API + '/api/history'); if (r && r.ok === false) toast('清空历史失败：HTTP ' + (r.status || '?')); }
      catch (e) { console.warn('[annota] 清空历史失败', e); toast('清空历史失败：' + reasonText(e)); }
      renderHistory();
    }
    async function clearDownloads() {
      try { const r = await window.vaFetch('DELETE', API + '/api/downloads'); if (r && r.ok === false) toast('清空下载记录失败：HTTP ' + (r.status || '?')); }
      catch (e) { console.warn('[annota] 清空下载记录失败', e); toast('清空下载记录失败：' + reasonText(e)); }
      renderDownloads();
    }

    // ---------- 显示入口 ----------
    // 复用同一个 overlay webview 切换内容时，Rust 会 eval 调这个。
    window.__vaOverlayShow = function (kind) {
      if (kind === 'history' || kind === 'downloads') { showPanel(kind); return; }
      panelKind = null;
      chromePanel.dataset.open = '0';
      chromePanel.innerHTML = '';
      menu.dataset.open = '1';
    };
    window.__vaOverlayShow(window.__VA_OVERLAY_KIND__ || 'menu');
  </script>
</body>
</html>
