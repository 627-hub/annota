<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Annota Overlay</title>
  <link rel="stylesheet" href="tokens.css" />
  <script src="i18n.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; background:transparent; overflow:hidden; }
    body {
      color:var(--va-text); font:13px/1.4 var(--va-font-ui);
      -webkit-font-smoothing:antialiased; user-select:none;
    }
    /* 透明遮罩：吃掉浮层内的点击，避免穿透到页面 */
    .backdrop { position:fixed; inset:0; background:transparent; }

    /* ============ 菜单（M7：固定宽度，锚在「更多」下方） ============ */
    .menu {
      position:absolute; top:0; left:0; width:100%; padding:6px;
      border:1px solid rgba(255,255,255,.1); border-radius:12px; background:#1a1b1f;
      box-shadow:0 16px 44px rgba(0,0,0,.5); display:none; flex-direction:column; gap:1px;
    }
    .menu[data-open="1"] { display:flex; }
    .menu button {
      display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border:0; border-radius:8px;
      background:transparent; color:#c4c9d0; font:12px var(--va-font-ui); text-align:left; cursor:pointer;
      transition:background-color 160ms var(--va-ease), color 160ms var(--va-ease), box-shadow 160ms var(--va-ease);
    }
    /* 列表行（直接子元素，不含缩放按钮）：行高与书签栏/历史行同一语言 */
    .menu > button { height:32px; padding:0 10px; border-radius:7px; }
    /* 与书签栏/历史行同一套悬停语言：底色抬升 + 轻阴影 */
    .menu button:hover { background:#1c1d22; color:#eceef1; box-shadow:0 2px 8px rgba(0,0,0,.25); }
    .menu button:active { background:#22242a; box-shadow:none; }
    .menu button:focus-visible { outline:2px solid var(--va-accent); outline-offset:-2px; }
    /* 菜单项图标：线性 stroke，与工具栏同一视觉家族；pointer-events:none 让点击目标仍是按钮本身（菜单靠 e.target.dataset 分发） */
    .menu [data-cmd] svg, .menu [data-action] svg {
      flex:none; width:15px; height:15px; color:#7d838d; pointer-events:none; transition:color 120ms var(--va-ease);
    }
    .menu button:hover svg { color:#e2e5ea; }
    .menu .menu-sep { height:1px; margin:5px 4px; background:rgba(255,255,255,.08); }
    .menu .menu-hint { padding:4px 10px 2px; color:#727781; font-size:9px; font-weight:700; letter-spacing:.1em; }
    .zoom-row { display:flex; align-items:center; gap:4px; padding:2px 6px 4px; }
    .zoom-btn {
      display:grid; place-items:center; height:28px; flex:1; padding:0; border:0; border-radius:7px;
      background:rgba(255,255,255,.04); color:#cfd3d9; cursor:pointer;
    }
    .zoom-btn:hover { background:rgba(255,255,255,.09); color:#f1f2f3; }
    .zoom-btn svg { width:14px; height:14px; }
    .zoom-btn--wide { font:600 11px var(--va-font-mono); }

    /* ============ 面板（历史 / 下载）：铺满剩余高度 ============ */
    .chrome-panel {
      position:absolute; inset:0; display:none; flex-direction:column; background:#17181c;
      border-top:1px solid rgba(255,255,255,.09); box-shadow:0 -18px 44px rgba(0,0,0,.42);
    }
    .chrome-panel[data-open="1"] { display:flex; }
    .chrome-panel-head { display:flex; align-items:center; gap:10px; flex:none; padding:11px 14px 11px 16px; border-bottom:1px solid rgba(255,255,255,.065); background:#141519; }
    .chrome-panel-title { color:#f0f1f3; font-size:13px; font-weight:600; letter-spacing:-.01em; }
    .chrome-panel-count { color:#6b717b; font:500 10.5px/1 var(--va-font-mono); letter-spacing:.02em; }
    .chrome-panel-spacer { flex:1; }
    .chrome-panel-btn {
      display:inline-flex; align-items:center; height:28px; padding:0 11px; border:1px solid rgba(255,255,255,.1);
      border-radius:8px; background:rgba(255,255,255,.03); color:#cfd3d9; font:12px var(--va-font-ui); cursor:pointer;
      transition:background-color 120ms var(--va-ease), color 120ms var(--va-ease), border-color 120ms var(--va-ease);
    }
    .chrome-panel-btn:hover { background:rgba(255,255,255,.08); color:#f1f2f3; }
    .chrome-panel-btn:active { background:rgba(255,255,255,.12); }
    .chrome-panel-btn.danger:hover { border-color:rgba(239,115,121,.5); color:#ef7379; }
    .chrome-panel-btn:focus-visible { outline:2px solid var(--va-accent); outline-offset:2px; }
    .chrome-panel-list { flex:1; overflow:auto; padding:6px 6px 10px; }

    /* 统一行式列表：图标位 + 主标题（截断）+ 次要信息（mono 小字）+ 右侧时间；行高固定 52px */
    /* 行高统一 46px（与书签栏同一行式语言）：图标位 + 主标题（截断）+ mono 次要信息 + 右侧时间。
       悬停：底色抬升 + 1px 上移 + 轻阴影；按下回落。 */
    .chrome-item {
      display:flex; align-items:center; gap:10px; height:46px; padding:0 12px 0 9px; border-radius:9px; cursor:pointer;
      transition:background-color 160ms var(--va-ease), box-shadow 160ms var(--va-ease), transform 160ms var(--va-ease);
    }
    .chrome-item:hover { background:#1c1d22; transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.28); }
    .chrome-item:active { background:#22242a; transform:none; box-shadow:none; }
    /* 图标位：站点 monogram（颜色由 JS 写入 --h，与标签/书签同一套算法）或下载中性图标 */
    .chrome-item-ico {
      display:grid; place-items:center; width:22px; height:22px; flex:none; border-radius:7px;
      color:hsl(var(--h, 200) 70% 80%); background:hsl(var(--h, 200) 24% 21%);
      box-shadow:inset 0 0 0 1px hsl(var(--h, 200) 30% 36% / .45);
      font:600 10px/1 var(--va-font-ui); text-transform:uppercase;
    }
    .chrome-item-ico.is-neutral { background:rgba(255,255,255,.05); color:#9ca2ac; box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); }
    .chrome-item-ico svg { width:13px; height:13px; }
    .chrome-item-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
    .chrome-item-title { color:#e4e6ea; font-size:12.5px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chrome-item-sub { color:#6b717b; font:500 10.5px/1.3 var(--va-font-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chrome-item-time { flex:none; min-width:56px; text-align:right; color:#6b717b; font:500 10.5px/1.3 var(--va-font-mono); white-space:nowrap; }
    .chrome-badge { display:inline-flex; align-items:center; flex:none; height:19px; padding:0 8px; border-radius:999px; font:600 10px var(--va-font-ui); }
    .chrome-badge.done { color:#7fe0b0; background:rgba(73,188,134,.13); }
    .chrome-badge.downloading { color:#f5c66a; background:rgba(245,166,35,.13); }
    .chrome-badge.failed { color:#ef9a9e; background:rgba(239,115,121,.13); }
    .chrome-empty { padding:46px 16px; text-align:center; color:#6b717b; font-size:12px; }
    /* 轻量 toast（P1-b#12）：浮层内右下角 */
    .toast-stack { position:fixed; right:8px; bottom:8px; z-index:var(--va-z-toast); display:flex; flex-direction:column; align-items:flex-end; gap:6px; max-width:calc(100% - 16px); pointer-events:none; }
    .toast { max-width:100%; padding:6px 10px; border:1px solid rgba(255,255,255,.1); border-left:3px solid var(--va-warning); border-radius:8px; background:#1e1f24; color:#e7e9ec; font:11.5px/1.45 var(--va-font-ui); box-shadow:0 8px 24px rgba(0,0,0,.4); overflow-wrap:anywhere; user-select:text; }
    .toast[data-kind="ok"] { border-left-color:#49bc86; }
    .toast[data-leaving="1"] { opacity:0; transition:opacity 200ms ease; }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <!-- 菜单 -->
  <div class="menu" id="menu" role="menu">
    <div class="menu-hint">工具</div>
    <button data-cmd="history" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>历史记录</button>
    <button data-cmd="downloads" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 19h14"/></svg>下载</button>
    <button data-cmd="no-restore" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3.5 4.5V9H8"/></svg>不恢复上次会话</button>
    <button data-cmd="workspace" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>打开工作区</button>
    <button data-action="trust-site" role="menuitem" title="允许本工具在当前网站上使用截图、剪贴板与 AI 等功能"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l7 2.6v5.2c0 4.3-2.9 7.7-7 9.2-4.1-1.5-7-4.9-7-9.2V6.1z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>信任当前站点</button>
    <div class="menu-sep"></div>
    <div class="menu-hint">缩放</div>
    <div class="zoom-row">
      <button class="zoom-btn" data-zoom="out" role="menuitem" aria-label="缩小" title="缩小 (⌘−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg></button>
      <button class="zoom-btn zoom-btn--wide" data-zoom="reset" role="menuitem" title="重置缩放 (⌘0)"><span id="menu-zoom-label">100%</span></button>
      <button class="zoom-btn" data-zoom="in" role="menuitem" aria-label="放大" title="放大 (⌘+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg></button>
    </div>
    <div class="menu-sep"></div>
    <button data-cmd="devtools" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 7 4 12l4.5 5M15.5 7l4.5 5-4.5 5M13.5 5l-3 14"/></svg>开发者工具</button>
    <button data-cmd="diag" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>诊断信息</button>
  </div>

  <!-- 历史 / 下载面板（按需渲染内容） -->
  <div class="chrome-panel" id="chrome-panel" data-open="0"></div>

  <script>
    // i18n.js 未能加载时的兜底：init 立即回调、t 返回 key（页面可工作，仅文案退回 key）
    if (typeof __i18n === 'undefined') { window.__i18n = { locale: 'zh-CN', strings: {}, init: function (cb) { cb(); }, t: function (k) { return k; } }; }
    __i18n.init(function () {
    // 菜单文案 / HTML 属性本地化：locale 就绪后第一时间同步到 DOM
    function applyI18n() {
      const t = (k) => __i18n.t(k);
      // 分组标题：纯文本 div
      const hints = document.querySelectorAll('#menu .menu-hint');
      if (hints[0]) hints[0].textContent = t('tools');
      if (hints[1]) hints[1].textContent = t('zoom');
      // 按钮文本：删掉所有纯文本子节点（保留 SVG），再插入翻译后的文本节点
      function setBtnText(sel, key) {
        const el = document.querySelector(sel);
        if (!el) return;
        Array.prototype.slice.call(el.childNodes).forEach((n) => { if (n.nodeType === 3) n.parentNode.removeChild(n); });
        el.appendChild(document.createTextNode(t(key)));
      }
      setBtnText('[data-cmd="history"]', 'history');
      setBtnText('[data-cmd="downloads"]', 'downloads');
      setBtnText('[data-cmd="no-restore"]', 'no_restore');
      setBtnText('[data-cmd="workspace"]', 'open_workspace');
      setBtnText('[data-action="trust-site"]', 'trust_site');
      setBtnText('[data-cmd="devtools"]', 'devtools');
      setBtnText('[data-cmd="diag"]', 'diag_info');

      const trust = document.querySelector('[data-action="trust-site"]');
      if (trust) trust.title = t('trust_site_title');

      const zOut = document.querySelector('[data-zoom="out"]');
      if (zOut) { zOut.setAttribute('aria-label', t('zoom_out_shortcut')); zOut.title = t('zoom_out_shortcut'); }
      const zReset = document.querySelector('[data-zoom="reset"]');
      if (zReset) zReset.title = t('zoom_reset');
      const zIn = document.querySelector('[data-zoom="in"]');
      if (zIn) { zIn.setAttribute('aria-label', t('zoom_in_shortcut')); zIn.title = t('zoom_in_shortcut'); }
    }
    applyI18n();
    document.documentElement.lang = __i18n.locale;

    const API = 'http://127.0.0.1:8793';
    const WORKSPACE = 'http://127.0.0.1:8793/';
    function tauri() { return window.__TAURI_INTERNALS__ || window.__TAURI__; }
    function invoke(cmd, args) {
      const t = tauri();
      if (!t || !t.invoke) throw new Error(__i18n.t('bridge_unavailable'));
      return t.invoke(cmd, args);
    }
    const menu = document.getElementById('menu');
    const chromePanel = document.getElementById('chrome-panel');
    const backdrop = document.getElementById('backdrop');

    function closeMe() { invoke('overlay_close').catch(() => {}); }
    backdrop.addEventListener('click', closeMe);

    // Esc 关闭；点击菜单外（面板区）关闭
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMe(); });

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmtAgo(ms) {
      const d = Date.now() - ms;
      if (d < 60000) return __i18n.t('just_now');
      const m = d / 60000; if (m < 60) return Math.floor(m) + __i18n.t('minutes_ago');
      const h = m / 60; if (h < 24) return Math.floor(h) + __i18n.t('hours_ago');
      const dd = h / 24; if (dd < 30) return Math.floor(dd) + __i18n.t('days_ago');
      try { return new Date(ms).toLocaleDateString(); } catch (e) { return ''; }
    }
    function fmtBytes(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + ' B';
      const u = ['KB', 'MB', 'GB', 'TB']; let i = -1;
      do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
      return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
    }

    // ---------- 列表行图标位（与 index.html 标签条的站点色块同一套算法：域名 hash → 稳定色相） ----------
    // 与 index.html 同一套色相表（不含紫/靛/品红），两页 monogram 颜色一致
    const SITE_HUES = [8, 26, 42, 96, 138, 162, 186, 204, 222, 350];
    const DL_ICON_HTML = '<span class="chrome-item-ico is-neutral" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 19h14"/></svg></span>';
    function hostOf(u) { try { return new URL(u).host.replace(/^www\./, '') || u; } catch (e) { return u || ''; } }
    function siteTileHtml(u) {
      const key = hostOf(u).split('.')[0] || '?';
      let h = 0;
      for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
      return '<span class="chrome-item-ico" aria-hidden="true" style="--h:' + SITE_HUES[h % SITE_HUES.length] + '">' +
        esc(key.slice(0, 1)) + '</span>';
    }

    // ---------- 缩放 ----------
    let zoomFactor = 1.0;
    try { zoomFactor = parseFloat(localStorage.getItem('va.browser.zoom')) || 1.0; } catch (e) {}
    function applyZoom() {
      invoke('set_zoom', { factor: zoomFactor }).catch(() => {});
      try { localStorage.setItem('va.browser.zoom', String(zoomFactor)); } catch (e) {}
      const label = document.getElementById('menu-zoom-label');
      if (label) label.textContent = Math.round(zoomFactor * 100) + '%';
    }
    function zoomBy(delta) { zoomFactor = Math.min(5.0, Math.max(0.25, +(zoomFactor + delta).toFixed(2))); applyZoom(); }
    menu.addEventListener('click', (e) => {
      const z = e.target && e.target.closest && e.target.closest('[data-zoom]');
      if (!z) return;
      e.stopPropagation();
      const kind = z.dataset.zoom;
      if (kind === 'in') zoomBy(0.1);
      else if (kind === 'out') zoomBy(-0.1);
      else { zoomFactor = 1.0; applyZoom(); }
    });
    applyZoom();

    // ---------- 菜单命令 ----------
    // 要点：①先发命令、完成后才关菜单（closeMe 销毁本 webview，先关会吞掉 invoke/alert）；
    // ②**失败不关菜单**——toast 就渲染在这个 webview 里，关了用户根本看不见（「无响应」的体感来源）；
    // ③分发用 closest('[data-cmd]')：点在 SVG 子节点时 e.target.dataset 是空的。
    menu.addEventListener('click', (e) => {
      const btn = e.target && e.target.closest && e.target.closest('[data-cmd]');
      const cmd = btn && btn.dataset ? btn.dataset.cmd : '';
      if (!cmd) return;
      if (cmd === 'history' || cmd === 'downloads') { showPanel(cmd); return; }
      const errText = (err) => String((err && err.message) || err || __i18n.t('unknown_error'));
      const fail = (err) => { toast(__i18n.t('action_failed') + errText(err), 'error'); };
      if (cmd === 'workspace') {
        Promise.resolve(invoke('navigate_browser', { url: WORKSPACE })).then(closeMe).catch(fail);
      } else if (cmd === 'no-restore') {
        Promise.resolve(invoke('tab_session_clear')).then(closeMe).catch(fail);
      } else if (cmd === 'devtools') {
        Promise.resolve(invoke('open_devtools')).then(closeMe).catch(fail);
      } else if (cmd === 'diag') {
        // 真机：子 webview 上 window.alert 不弹（WKUIDelegate 未挂），改用本页 toast。
        // 结果要被人读到 → 不关菜单（关窗会连 toast 一起销毁）。
        Promise.all([
          Promise.resolve(invoke('tabs_snapshot')).catch(() => null),
          Promise.resolve(invoke('diag_status')).catch(() => null),
        ]).then(([snap, d]) => {
          const tabs = (snap && snap.tabs) || [];
          const active = tabs.find((t) => t.active);
          const parts = [
            __i18n.t('tabs_count') + tabs.length + (active ? __i18n.t('active_tag') + (active.id || '?') + __i18n.t('close_paren') : ''),
            d ? (d.running ? __i18n.t('service_ok') : __i18n.t('service_not_running')) : null,
            d && d.error ? String(d.error).slice(0, 40) : null,
            d && d.db_memory ? __i18n.t('db_memory') : null,
            d && d.corrupt_packs && d.corrupt_packs.length ? __i18n.t('corrupt_prefix') + d.corrupt_packs.length + __i18n.t('corrupt_suffix') : null,
          ].filter(Boolean);
          toast(__i18n.t('diag_prefix') + parts.join(' · '), 'ok');
        }).catch(fail);
      }
    });

    // 信任当前站点：菜单保持打开，结果以 toast 反馈（成功 / 失败都留在菜单上）
    menu.addEventListener('click', (e) => {
      const btn = e.target && e.target.closest && e.target.closest('[data-action="trust-site"]');
      if (!btn) return;
      e.stopPropagation();
      btn.disabled = true;
      let pending;
      try { pending = Promise.resolve(invoke('trust_current_site')); }
      catch (err) { pending = Promise.reject(err); }
      pending.then(
        (origin) => toast(__i18n.t('trusted') + (typeof origin === 'string' && origin ? origin : __i18n.t('current_site')), 'ok'),
        (err) => { console.warn('[annota] 信任当前站点失败', err); toast(__i18n.t('trust_failed') + reasonText(err)); }
      ).finally(() => { btn.disabled = false; });
    });

    // ---------- 面板 ----------
    let panelKind = null;
    function panelHead(title, clearLabel) {
      return '<div class="chrome-panel-head"><span class="chrome-panel-title">' + esc(title) + '</span>' +
        '<span class="chrome-panel-count" id="panel-count"></span><span class="chrome-panel-spacer"></span>' +
        '<button class="chrome-panel-btn danger" id="panel-clear">' + esc(clearLabel) + '</button>' +
        '<button class="chrome-panel-btn" id="panel-close">' + esc(__i18n.t('close')) + '</button></div>' +
        '<div class="chrome-panel-list" id="panel-list"></div>';
    }
    function wirePanel(clearFn) {
      const close = document.getElementById('panel-close');
      if (close) close.addEventListener('click', closeMe);
      const clr = document.getElementById('panel-clear');
      if (clr) clr.addEventListener('click', clearFn);
    }
    function showPanel(kind) {
      panelKind = kind;
      menu.dataset.open = '0';
      chromePanel.dataset.open = '1';
      if (kind === 'history') renderHistory(); else renderDownloads();
    }
    async function renderHistory() {
      chromePanel.innerHTML = panelHead(__i18n.t('history'), __i18n.t('clear_history'));
      wirePanel(clearHistory);
      let rows = [];
      try { const r = await window.vaFetch('GET', API + '/api/history?limit=200'); rows = (r && r.ok && r.json && r.json.history) || []; } catch (e) {}
      if (panelKind !== 'history') return;
      const list = document.getElementById('panel-list'); if (!list) return;
      const cnt = document.getElementById('panel-count'); if (cnt) cnt.textContent = rows.length + __i18n.t('items');
      if (!rows.length) { list.innerHTML = '<div class="chrome-empty">' + __i18n.t('no_history') + '</div>'; return; }
      list.innerHTML = rows.map((it) =>
        '<div class="chrome-item" data-url="' + esc(it.url) + '" title="' + esc(it.url) + '">' + siteTileHtml(it.url) +
        '<div class="chrome-item-main">' +
        '<div class="chrome-item-title">' + esc(it.title || it.url) + '</div>' +
        '<div class="chrome-item-sub">' + esc(hostOf(it.url)) + '</div></div>' +
        '<div class="chrome-item-time">' + fmtAgo(it.visit_at) + '</div></div>').join('');
      list.querySelectorAll('.chrome-item').forEach((el) => el.addEventListener('click', () => {
        // 成功才收起浮层；失败留在面板上，让 toast 可见
        invoke('navigate_browser', { url: el.dataset.url }).then(
          () => closeMe(),
          (e) => { console.warn('[annota] 打开历史记录失败', e); toast(__i18n.t('open_failed') + reasonText(e)); }
        );
      }));
    }
    async function renderDownloads() {
      chromePanel.innerHTML = panelHead(__i18n.t('downloads'), __i18n.t('clear_downloads'));
      wirePanel(clearDownloads);
      let rows = [];
      try { const r = await window.vaFetch('GET', API + '/api/downloads'); rows = (r && r.ok && r.json && r.json.downloads) || []; } catch (e) {}
      if (panelKind !== 'downloads') return;
      const list = document.getElementById('panel-list'); if (!list) return;
      const cnt = document.getElementById('panel-count'); if (cnt) cnt.textContent = rows.length + __i18n.t('items');
      if (!rows.length) { list.innerHTML = '<div class="chrome-empty">' + __i18n.t('no_downloads') + '</div>'; return; }
      const label = { done: __i18n.t('done'), downloading: __i18n.t('downloading_status'), failed: __i18n.t('failed') };
      list.innerHTML = rows.map((it) =>
        '<div class="chrome-item" data-path="' + esc(it.path || '') + '" title="' + esc(it.path || it.url) + '">' + DL_ICON_HTML +
        '<div class="chrome-item-main">' +
        '<div class="chrome-item-title">' + esc(it.filename || it.url) + '</div>' +
        '<div class="chrome-item-sub">' + fmtBytes(it.size) + (it.path ? ' · ' + esc(it.path) : '') + '</div></div>' +
        '<span class="chrome-badge ' + esc(it.status) + '">' + esc(label[it.status] || it.status) + '</span>' +
        '<div class="chrome-item-time">' + fmtAgo(it.created_at) + '</div></div>').join('');
      list.querySelectorAll('.chrome-item').forEach((el) => el.addEventListener('click', () => {
        const p = el.dataset.path;
        if (p && window.__ANNOTA__ && window.__ANNOTA__.copyToClipboard) window.__ANNOTA__.copyToClipboard({ text: p }).catch(() => {});
      }));
    }
    // P1-b#12：清空失败不再静默，给出 toast（浮层内右下角，2-3 秒消失）
    function reasonText(e) {
      if (e == null) return __i18n.t('unknown_error');
      if (typeof e === 'string') return e;
      if (e instanceof Error) return e.message || String(e);
      if (typeof e === 'object') {
        if (typeof e.message === 'string' && e.message) return e.message;
        if (typeof e.error === 'string' && e.error) return e.error;
        try { return JSON.stringify(e); } catch (x) { return String(e); }
      }
      return String(e);
    }
    function toast(msg, kind) {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const el = document.createElement('div');
      el.className = 'toast'; el.dataset.kind = kind || 'error'; el.setAttribute('role', kind === 'ok' ? 'status' : 'alert');
      el.textContent = msg;
      stack.appendChild(el);
      while (stack.children.length > 2) stack.firstElementChild.remove();
      setTimeout(() => { el.dataset.leaving = '1'; setTimeout(() => el.remove(), 220); }, 3000);
    }
    async function clearHistory() {
      try { const r = await window.vaFetch('DELETE', API + '/api/history'); if (r && r.ok === false) toast(__i18n.t('clear_history_failed') + 'HTTP ' + (r.status || '?')); }
      catch (e) { console.warn('[annota] 清空历史失败', e); toast(__i18n.t('clear_history_failed') + reasonText(e)); }
      renderHistory();
    }
    async function clearDownloads() {
      try { const r = await window.vaFetch('DELETE', API + '/api/downloads'); if (r && r.ok === false) toast(__i18n.t('clear_downloads_failed') + 'HTTP ' + (r.status || '?')); }
      catch (e) { console.warn('[annota] 清空下载记录失败', e); toast(__i18n.t('clear_downloads_failed') + reasonText(e)); }
      renderDownloads();
    }

    // ---------- 显示入口 ----------
    // 复用同一个 overlay webview 切换内容时，Rust 会 eval 调这个。
    window.__vaOverlayShow = function (kind) {
      if (kind === 'history' || kind === 'downloads') { showPanel(kind); return; }
      panelKind = null;
      chromePanel.dataset.open = '0';
      chromePanel.innerHTML = '';
      menu.dataset.open = '1';
    };
    window.__vaOverlayShow(window.__VA_OVERLAY_KIND__ || 'menu');
    });
  </script>
