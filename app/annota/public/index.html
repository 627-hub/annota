<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Annota Browser</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      color:var(--va-text); background:#101114; font:13px/1.4 var(--va-font-ui);
      -webkit-font-smoothing:antialiased; user-select:none;
    }

    /* ============ Row 1 · 标签条 ============ */
    .tabstrip {
      display:flex; align-items:center; gap:5px; width:100%; height:38px; padding:0 10px;
      border-bottom:1px solid rgba(255,255,255,.075); background:#0e0f12;
    }
    .tabs-scroll { display:flex; align-items:center; gap:5px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
    .tabs-scroll::-webkit-scrollbar { display:none; }
    .tab {
      display:flex; align-items:center; gap:7px; max-width:210px; min-width:104px; height:28px; padding:0 6px 0 10px;
      border:1px solid transparent; border-radius:8px; background:rgba(255,255,255,.035); color:#a9aeb6;
      font:12px var(--va-font-ui); cursor:pointer; white-space:nowrap; flex:none;
    }
    .tab:hover { background:rgba(255,255,255,.07); }
    .tab[data-active="1"] { background:#1b1c21; border-color:rgba(245,166,35,.32); color:#f0f1f3; }
    .tab .tab-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .tab .tab-close { display:grid; place-items:center; width:16px; height:16px; flex:none; border-radius:5px; color:#7d838d; }
    .tab .tab-close:hover { background:rgba(255,255,255,.14); color:#f1f2f3; }
    .tab-new {
      display:grid; place-items:center; width:26px; height:26px; flex:none; border:1px solid transparent; border-radius:7px;
      background:transparent; color:#8b9099; cursor:pointer;
    }
    .tab-new:hover { background:rgba(255,255,255,.08); color:#f1f2f3; }
    .tab-new svg { width:15px; height:15px; }

    /* ============ Row 2 · 导航条 ============ */
    .toolbar {
      display:flex; align-items:center; gap:10px; width:100%; height:56px; padding:0 13px;
      border-bottom:1px solid rgba(255,255,255,.075); background:#111216;
      box-shadow:0 3px 15px rgba(0,0,0,.12);
    }
    .brand { display:flex; align-items:center; gap:9px; flex:none; color:#f3f3f4; cursor:pointer; }
    .brand:hover .brand-mark { border-color:rgba(245,166,35,.6); background:rgba(245,166,35,.16); }
    .brand-mark {
      position:relative; display:grid; place-items:center; width:31px; height:31px; flex:none;
      border:1px solid rgba(245,166,35,.34); border-radius:10px; background:rgba(245,166,35,.105); color:var(--va-accent);
    }
    .brand-mark svg { width:19px; height:19px; }
    .brand-copy { display:flex; flex-direction:column; min-width:0; line-height:1.15; }
    .brand-name { font-size:13px; font-weight:680; letter-spacing:-.035em; }
    .brand-sub { margin-top:1px; color:#727781; font-size:8px; font-weight:600; letter-spacing:.13em; }

    .nav { display:flex; align-items:center; gap:1px; flex:none; }
    .tool-button {
      display:grid; place-items:center; width:32px; height:32px; padding:0; border:1px solid transparent; border-radius:9px;
      background:transparent; color:#858a93; cursor:pointer; transition:background 120ms ease,color 120ms ease;
    }
    .tool-button:hover:not(:disabled) { background:rgba(255,255,255,.075); color:#f1f2f3; }
    .tool-button:disabled { opacity:.32; cursor:default; }
    .tool-button.is-active { color:var(--va-accent); background:rgba(245,166,35,.13); }
    .tool-button svg { width:16px; height:16px; }

    .omnibox {
      display:flex; align-items:center; gap:9px; min-width:100px; max-width:860px; height:36px; flex:1;
      padding:0 8px 0 11px; border:1px solid rgba(255,255,255,.085); border-radius:11px;
      background:#191a1e; transition:border-color 140ms ease,background 140ms ease,box-shadow 140ms ease;
    }
    .omnibox:focus-within { border-color:rgba(245,166,35,.52); background:#1c1c1f; box-shadow:0 0 0 3px rgba(245,166,35,.08); }
    .site-icon { display:grid; place-items:center; width:19px; height:19px; flex:none; color:#7d838d; }
    .site-icon svg { width:15px; height:15px; }
    #url {
      width:100%; min-width:0; height:32px; padding:0; border:0; outline:0; background:transparent;
      color:#d7d8dc; font:12px var(--va-font-mono); user-select:text;
    }
    #url::placeholder { color:#686d76; font-family:var(--va-font-ui); }
    .go-button {
      display:grid; place-items:center; width:27px; height:27px; flex:none; padding:0; border:0; border-radius:8px;
      background:var(--va-accent); color:#251908; cursor:pointer; transition:filter 120ms ease,transform 120ms ease;
    }
    .go-button:hover { filter:brightness(1.08); }
    .go-button:active { transform:scale(.94); }
    .go-button svg { width:15px; height:15px; }
    .toolbar-separator { width:1px; height:22px; flex:none; background:rgba(255,255,255,.08); }

    .update-pill {
      display:none; align-items:center; gap:7px; flex:none; height:30px; padding:0 11px;
      border:1px solid rgba(245,166,35,.5); border-radius:9px; background:rgba(245,166,35,.14);
      color:#f5c66a; font:600 11px var(--va-font-ui); cursor:pointer; white-space:nowrap;
    }
    .update-pill[data-on="1"] { display:inline-flex; }
    .update-pill:hover { background:rgba(245,166,35,.22); }
    .update-pill .dot { width:6px; height:6px; border-radius:50%; background:var(--va-accent); }
    .update-pill[data-state="busy"] { opacity:.7; pointer-events:none; }

    .engine-state { display:flex; align-items:center; gap:7px; min-width:54px; color:#7c828b; font-size:9px; font-weight:600; letter-spacing:.09em; white-space:nowrap; }
    .engine-dot { width:6px; height:6px; border-radius:50%; background:#49bc86; box-shadow:0 0 8px rgba(73,188,134,.35); }
    .engine-state[data-state="error"] .engine-dot { background:#ef7379; box-shadow:0 0 8px rgba(239,115,121,.35); }
    .engine-state[data-state="busy"] .engine-dot { background:var(--va-accent); box-shadow:0 0 8px rgba(245,166,35,.4); }
    .engine-state span:last-child { max-width:76px; overflow:hidden; text-overflow:ellipsis; }

    /* ⋯ 更多菜单 */
    .menu-wrap { position:relative; flex:none; }
    .menu {
      position:absolute; top:38px; right:0; z-index:50; min-width:196px; padding:6px;
      border:1px solid rgba(255,255,255,.1); border-radius:12px; background:#1a1b1f;
      box-shadow:0 16px 44px rgba(0,0,0,.5); display:none; flex-direction:column; gap:1px;
    }
    .menu[data-open="1"] { display:flex; }
    .menu button {
      display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border:0; border-radius:8px;
      background:transparent; color:#cfd3d9; font:12px var(--va-font-ui); text-align:left; cursor:pointer;
    }
    .menu button:hover { background:rgba(255,255,255,.07); }
    .menu .menu-sep { height:1px; margin:5px 4px; background:rgba(255,255,255,.08); }
    .menu .menu-hint { padding:4px 10px 2px; color:#727781; font-size:9px; font-weight:700; letter-spacing:.1em; }

    /* ============ Chrome 面板（历史 / 下载，M6） ============ */
    .chrome-panel {
      position:absolute; top:94px; left:0; right:0; bottom:0; z-index:40;
      display:none; flex-direction:column; background:#17181c;
      border-bottom:1px solid rgba(255,255,255,.09); box-shadow:0 18px 44px rgba(0,0,0,.42);
    }
    .chrome-panel[data-open="1"] { display:flex; }
    .chrome-panel-head { display:flex; align-items:center; gap:10px; flex:none; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.07); }
    .chrome-panel-title { color:#f0f1f3; font-size:13px; font-weight:680; }
    .chrome-panel-count { color:#727781; font-size:11px; }
    .chrome-panel-spacer { flex:1; }
    .chrome-panel-btn {
      display:inline-flex; align-items:center; height:28px; padding:0 11px; border:1px solid rgba(255,255,255,.1);
      border-radius:8px; background:rgba(255,255,255,.03); color:#cfd3d9; font:12px var(--va-font-ui); cursor:pointer;
    }
    .chrome-panel-btn:hover { background:rgba(255,255,255,.08); color:#f1f2f3; }
    .chrome-panel-btn.danger:hover { border-color:rgba(239,115,121,.5); color:#ef7379; }
    .chrome-panel-list { flex:1; overflow:auto; padding:6px; }
    .chrome-item { display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px; cursor:pointer; }
    .chrome-item:hover { background:rgba(255,255,255,.06); }
    .chrome-item-main { flex:1; min-width:0; }
    .chrome-item-title { color:#e7e9ec; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chrome-item-sub { margin-top:2px; color:#7c828b; font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chrome-item-time { flex:none; color:#727781; font-size:10.5px; }
    .chrome-badge { display:inline-flex; align-items:center; flex:none; height:20px; padding:0 8px; border-radius:999px; font:600 10px var(--va-font-ui); }
    .chrome-badge.done { color:#7fe0b0; background:rgba(73,188,134,.14); }
    .chrome-badge.downloading { color:#f5c66a; background:rgba(245,166,35,.14); }
    .chrome-badge.failed { color:#ef9a9e; background:rgba(239,115,121,.14); }
    .chrome-empty { padding:46px 16px; text-align:center; color:#727781; font-size:12px; }
    .chrome-dot { display:none; position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--va-accent); box-shadow:0 0 6px rgba(245,166,35,.6); }

    button:focus-visible { outline:2px solid var(--va-accent); outline-offset:2px; }

    @media (max-width:720px) {
      .toolbar { gap:7px; padding:0 9px; }
      .brand-copy { display:none; }
      .tab { min-width:0; max-width:40px; padding:0; justify-content:center; }
      .tab .tab-title, .tab .tab-close { display:none; }
      .engine-state { display:none; }
    }
  </style>
</head>
<body>
  <!-- Row 1 · 标签条 -->
  <div class="tabstrip" id="tabstrip" role="tablist" aria-label="标签页">
    <div class="tabs-scroll" id="tabs-scroll"></div>
    <button class="tab-new" id="tab-new" type="button" aria-label="新建标签页" title="新建标签页 (⌘T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <!-- Row 2 · 导航条 -->
  <header class="toolbar" role="toolbar" aria-label="Annota 浏览器导航">
    <div class="brand" id="home-button" role="button" tabindex="0" aria-label="Annota 首页" title="打开 Annota 首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 19 7.5-14 7.5 14M8.2 13.2h7.6"/><path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4" opacity=".55"/></svg>
      </span>
      <span class="brand-copy"><span class="brand-name">Annota</span><span class="brand-sub">CONTENT BROWSER</span></span>
    </div>
    <nav class="nav" aria-label="页面导航">
      <button class="tool-button" id="btn-back" type="button" aria-label="后退" title="后退" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg></button>
      <button class="tool-button" id="btn-forward" type="button" aria-label="前进" title="前进" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 5 7 7-7 7"/></svg></button>
      <button class="tool-button" id="btn-reload" type="button" aria-label="刷新" title="刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.8 9a7 7 0 0 1 11.7-2L20 12M4 12l2.5 5a7 7 0 0 0 11.7-2"/></svg></button>
    </nav>
    <form class="omnibox" id="nav-form">
      <span class="site-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="搜索或输入网址" aria-label="搜索或输入网址" />
      <button class="go-button" type="submit" aria-label="打开网址" title="打开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
    </form>
    <button class="tool-button" id="btn-bookmark" type="button" aria-label="收藏" title="收藏此页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg></button>
    <button class="tool-button" id="btn-edit" type="button" aria-label="编辑" title="进入编辑（侧栏）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 5l4 4"/></svg></button>
    <button class="update-pill" id="update-pill" type="button" title="" aria-label="安装更新"><i class="dot"></i><span id="update-label">有新版本</span></button>
    <span class="toolbar-separator"></span>
    <div class="menu-wrap">
      <button class="tool-button" id="btn-menu" type="button" aria-label="更多" title="更多"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
      <i class="chrome-dot" id="dl-dot"></i>
      <div class="menu" id="menu" role="menu">
        <div class="menu-hint">工具</div>
        <button data-cmd="history" role="menuitem">历史记录</button>
        <button data-cmd="downloads" role="menuitem">下载</button>
        <button data-cmd="workspace" role="menuitem">打开工作区</button>
        <div class="menu-sep"></div>
        <button data-cmd="diag" role="menuitem">诊断信息</button>
      </div>
    </div>
    <div class="engine-state" id="engine-state" data-state="ready" role="status" aria-live="polite"><i class="engine-dot"></i><span id="engine-label">LOCAL</span></div>
  </header>

  <!-- 历史 / 下载面板（展开态渲染，M6） -->
  <div class="chrome-panel" id="chrome-panel" data-open="0"></div>

  <script>
    const input = document.getElementById('url');
    const form = document.getElementById('nav-form');
    const engine = document.getElementById('engine-state');
    const engineLabel = document.getElementById('engine-label');
    const WORKSPACE = 'http://127.0.0.1:8793/';
    function tauri() { return window.__TAURI_INTERNALS__ || window.__TAURI__; }
    function invoke(cmd, args) {
      const t = tauri();
      if (!t || !t.invoke) throw new Error('Annota bridge 不可用');
      return t.invoke(cmd, args);
    }

    /* ---- 导航 ---- */
    async function navigate(raw) {
      const value = (raw != null ? raw : input.value).trim();
      if (!value) return;
      engine.dataset.state = 'busy'; engineLabel.textContent = 'OPENING';
      try {
        await invoke('navigate_browser', { url: value });
        engine.dataset.state = 'ready'; engineLabel.textContent = 'LOCAL';
      } catch (e) { engine.dataset.state = 'error'; engineLabel.textContent = 'ERROR'; }
    }
    form.addEventListener('submit', (e) => { e.preventDefault(); navigate(); });
    input.addEventListener('focus', () => input.select());
    document.getElementById('btn-back').addEventListener('click', () => invoke('browser_action', { action: 'back' }).catch(() => {}));
    document.getElementById('btn-forward').addEventListener('click', () => invoke('browser_action', { action: 'forward' }).catch(() => {}));
    document.getElementById('btn-reload').addEventListener('click', () => invoke('browser_action', { action: 'reload' }).catch(() => {}));
    function openHome() { navigate(WORKSPACE); }
    document.getElementById('home-button').addEventListener('click', openHome);
    document.getElementById('home-button').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openHome(); } });

    /* ---- 编辑态切换（观看 ↔ 编辑）---- */
    let shellMode = 'view';
    const btnEdit = document.getElementById('btn-edit');
    function applyEditUI() {
      const on = shellMode === 'edit';
      btnEdit.classList.toggle('is-active', on);
      btnEdit.setAttribute('title', on ? '退出编辑' : '进入编辑（侧栏）');
      try { localStorage.setItem('va.browser.shellMode', shellMode); } catch (e) {}
    }
    try { shellMode = localStorage.getItem('va.browser.shellMode') === 'edit' ? 'edit' : 'view'; } catch (e) {}
    btnEdit.addEventListener('click', () => {
      shellMode = shellMode === 'edit' ? 'view' : 'edit';
      applyEditUI();
      invoke('set_shell_mode', { mode: shellMode }).catch(() => {});
    });
    applyEditUI();
    // 进入编辑后，新激活/新开的 tab 也要同步态
    function pushModeToTab() { invoke('set_shell_mode', { mode: shellMode }).catch(() => {}); }

    /* ---- Chrome 面板 / 工具栏展开（M6） ---- */
    const btnMenu = document.getElementById('btn-menu');
    const menu = document.getElementById('menu');
    const chromePanel = document.getElementById('chrome-panel');
    const dlDot = document.getElementById('dl-dot');
    const API = 'http://127.0.0.1:8793';
    let panelKind = null; // null | 'history' | 'downloads'

    function setExpanded(on) { try { invoke('set_toolbar_expanded', { expanded: !!on }); } catch (e) {} }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmtAgo(ms) {
      const d = Date.now() - ms;
      if (d < 60000) return '刚刚';
      const m = d / 60000; if (m < 60) return Math.floor(m) + ' 分钟前';
      const h = m / 60; if (h < 24) return Math.floor(h) + ' 小时前';
      const dd = h / 24; if (dd < 30) return Math.floor(dd) + ' 天前';
      try { return new Date(ms).toLocaleDateString(); } catch (e) { return ''; }
    }
    function fmtBytes(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + ' B';
      const u = ['KB', 'MB', 'GB', 'TB']; let i = -1;
      do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
      return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
    }
    function panelHead(title, clearLabel) {
      return '<div class="chrome-panel-head"><span class="chrome-panel-title">' + esc(title) + '</span>' +
        '<span class="chrome-panel-count" id="panel-count"></span><span class="chrome-panel-spacer"></span>' +
        '<button class="chrome-panel-btn danger" id="panel-clear">' + esc(clearLabel) + '</button>' +
        '<button class="chrome-panel-btn" id="panel-close">关闭</button></div>' +
        '<div class="chrome-panel-list" id="panel-list"></div>';
    }
    function wirePanel(clearFn) {
      const close = document.getElementById('panel-close');
      if (close) close.addEventListener('click', closePanel);
      const clr = document.getElementById('panel-clear');
      if (clr) clr.addEventListener('click', clearFn);
    }
    function openPanel(kind) {
      panelKind = kind;
      setExpanded(true);
      chromePanel.dataset.open = '1';
      if (kind === 'downloads') dlDot.style.display = 'none';
      if (kind === 'history') renderHistory(); else renderDownloads();
    }
    function closePanel() {
      panelKind = null;
      chromePanel.dataset.open = '0';
      chromePanel.innerHTML = '';
      if (menu.dataset.open !== '1') setExpanded(false);
    }
    async function renderHistory() {
      chromePanel.innerHTML = panelHead('历史记录', '清空历史');
      wirePanel(clearHistory);
      let rows = [];
      try { const r = await window.vaFetch('GET', API + '/api/history?limit=200'); rows = (r && r.ok && r.json && r.json.history) || []; } catch (e) {}
      if (panelKind !== 'history') return; // 面板已切换，丢弃过期结果
      const list = document.getElementById('panel-list'); if (!list) return;
      const cnt = document.getElementById('panel-count'); if (cnt) cnt.textContent = rows.length + ' 条';
      if (!rows.length) { list.innerHTML = '<div class="chrome-empty">暂无历史记录</div>'; return; }
      list.innerHTML = rows.map((it) =>
        '<div class="chrome-item" data-url="' + esc(it.url) + '"><div class="chrome-item-main">' +
        '<div class="chrome-item-title">' + esc(it.title || hostOf(it.url)) + '</div>' +
        '<div class="chrome-item-sub">' + esc(it.url) + '</div></div>' +
        '<div class="chrome-item-time">' + fmtAgo(it.visit_at) + '</div></div>').join('');
      list.querySelectorAll('.chrome-item').forEach((el) => el.addEventListener('click', () => { navigate(el.dataset.url); closePanel(); }));
    }
    async function renderDownloads() {
      chromePanel.innerHTML = panelHead('下载', '清空记录');
      wirePanel(clearDownloads);
      let rows = [];
      try { const r = await window.vaFetch('GET', API + '/api/downloads'); rows = (r && r.ok && r.json && r.json.downloads) || []; } catch (e) {}
      if (panelKind !== 'downloads') return; // 面板已切换，丢弃过期结果
      const list = document.getElementById('panel-list'); if (!list) return;
      const cnt = document.getElementById('panel-count'); if (cnt) cnt.textContent = rows.length + ' 条';
      if (!rows.length) { list.innerHTML = '<div class="chrome-empty">暂无下载记录</div>'; return; }
      const label = { done: '已完成', downloading: '下载中', failed: '失败' };
      list.innerHTML = rows.map((it) =>
        '<div class="chrome-item" data-path="' + esc(it.path || '') + '" title="' + esc(it.path || it.url) + '"><div class="chrome-item-main">' +
        '<div class="chrome-item-title">' + esc(it.filename || it.url) + '</div>' +
        '<div class="chrome-item-sub">' + fmtBytes(it.size) + (it.path ? ' · ' + esc(it.path) : '') + '</div></div>' +
        '<span class="chrome-badge ' + esc(it.status) + '">' + esc(label[it.status] || it.status) + '</span>' +
        '<div class="chrome-item-time">' + fmtAgo(it.created_at) + '</div></div>').join('');
      list.querySelectorAll('.chrome-item').forEach((el) => el.addEventListener('click', () => {
        const p = el.dataset.path;
        if (p && window.__ANNOTA__ && window.__ANNOTA__.copyToClipboard) window.__ANNOTA__.copyToClipboard({ text: p }).catch(() => {});
      }));
    }
    async function clearHistory() { try { await window.vaFetch('DELETE', API + '/api/history'); } catch (e) {} renderHistory(); }
    async function clearDownloads() { try { await window.vaFetch('DELETE', API + '/api/downloads'); } catch (e) {} renderDownloads(); }

    /* ---- 收藏星标（M6 接后端） ---- */
    const btnBookmark = document.getElementById('btn-bookmark');
    let bookmarkUrls = new Set();
    function activeTab() { return tabsState.find((t) => t.active); }
    function activeUrl() { const a = activeTab(); if (!a) return ''; return tabUrlCache[a.id] || a.url || ''; }
    function applyBookmarkUI() {
      const url = activeUrl();
      const on = !!url && bookmarkUrls.has(url);
      btnBookmark.classList.toggle('is-active', on);
      btnBookmark.setAttribute('title', on ? '已收藏' : '收藏此页');
    }
    async function refreshBookmarks() {
      try {
        const r = await window.vaFetch('GET', API + '/api/bookmarks');
        if (!(r && r.ok)) return; // 请求失败不清空本地状态（避免星标全灭）
        const arr = (r.json && r.json.bookmarks) || [];
        bookmarkUrls = new Set(arr.map((b) => b.url));
        applyBookmarkUI();
      } catch (e) {}
    }
    btnBookmark.addEventListener('click', async () => {
      const a = activeTab(); const url = activeUrl();
      if (!a || !url) return;
      try {
        if (bookmarkUrls.has(url)) {
          const r = await window.vaFetch('DELETE', API + '/api/bookmarks?url=' + encodeURIComponent(url));
          if (r && r.ok) bookmarkUrls.delete(url);
        } else {
          const r = await window.vaFetch('POST', API + '/api/bookmarks', { url: url, title: a.title || hostOf(url) });
          if (r && r.ok) bookmarkUrls.add(url);
        }
      } catch (e) {}
      applyBookmarkUI();
    });
    refreshBookmarks();
    setTimeout(refreshBookmarks, 900);

    /* ---- ⋯ 更多菜单 ---- */
    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.dataset.open === '1';
      menu.dataset.open = open ? '0' : '1';
      if (!open) setExpanded(true);
      else if (!panelKind) setExpanded(false);
    });
    document.addEventListener('click', () => {
      if (menu.dataset.open === '1') {
        menu.dataset.open = '0';
        if (!panelKind) setExpanded(false);
      }
    });
    menu.addEventListener('click', (e) => {
      const cmd = e.target && e.target.dataset && e.target.dataset.cmd;
      if (!cmd) return;
      menu.dataset.open = '0';
      if (cmd === 'workspace') { if (!panelKind) setExpanded(false); navigate(WORKSPACE); }
      else if (cmd === 'history') openPanel('history');
      else if (cmd === 'downloads') openPanel('downloads');
      else if (cmd === 'diag') {
        if (!panelKind) setExpanded(false);
        const active = activeTab();
        alert('Annota 诊断\n\n活动标签：' + (active ? active.id : '-') +
              '\nURL：' + (active ? active.url : '-') +
              '\n标签数：' + tabsState.length +
              '\n引擎：' + engineLabel.textContent);
      }
    });

    /* ---- 自动更新 ---- */
    const updatePill = document.getElementById('update-pill');
    const updateLabel = document.getElementById('update-label');
    function onUpdateAvailable(payload) {
      const v = (payload && payload.version) || '';
      updateLabel.textContent = v ? ('更新到 ' + v) : '有新版本';
      updatePill.setAttribute('title', '点击下载并安装 Annota ' + v + '（安装后自动重启）');
      updatePill.dataset.on = '1';
    }
    updatePill.addEventListener('click', async () => {
      updatePill.dataset.state = 'busy'; updateLabel.textContent = '正在下载…';
      try { await invoke('install_update'); }
      catch (e) { updatePill.dataset.state = ''; updateLabel.textContent = '更新失败，重试'; updatePill.setAttribute('title', String((e && e.message) || e)); }
    });

    /* ---- 事件订阅 ---- */
    (function subscribe() {
      const t = tauri();
      if (t && t.event && t.event.listen) {
        t.event.listen('annota://update-available', (ev) => onUpdateAvailable(ev.payload));
        t.event.listen('annota://tabs-changed', (ev) => renderTabs((ev.payload && ev.payload.tabs) || []));
        t.event.listen('annota://tab-updated', (ev) => {
          const p = ev.payload || {};
          if (!p.id) return;
          if (p.url) tabUrlCache[p.id] = p.url;
          if (p.active) setOmnibox(tabUrlCache[p.id]);
          document.getElementById('btn-reload').classList.toggle('is-active', !!p.loading);
          applyBookmarkUI();
        });
        t.event.listen('annota://download-started', () => {
          dlDot.style.display = 'block';
          if (panelKind === 'downloads') renderDownloads();
        });
        t.event.listen('annota://download-finished', () => {
          if (panelKind === 'downloads') renderDownloads();
        });
        // 内容 webview 内切换编辑态（如 Cmd/Ctrl+E）→ 同步工具栏按钮
        t.event.listen('annota://shell-mode-changed', (ev) => {
          const m = ev.payload && ev.payload.mode === 'edit' ? 'edit' : 'view';
          if (m !== shellMode) { shellMode = m; applyEditUI(); }
        });
      }
    })();

    /* ---- 标签页 ---- */
    const tabsScroll = document.getElementById('tabs-scroll');
    const tabNew = document.getElementById('tab-new');
    const tabUrlCache = {};
    let tabsState = [];
    function hostOf(u) { try { return new URL(u).host.replace(/^www\./, '') || u; } catch (e) { return u || ''; } }
    function setOmnibox(u) { if (u && document.activeElement !== input) input.value = u; }
    function renderTabs(tabs) {
      tabsState = tabs || [];
      Array.from(tabsScroll.querySelectorAll('.tab')).forEach((n) => n.remove());
      let activeUrl = '';
      tabsState.forEach((t) => {
        if (t.url) tabUrlCache[t.id] = t.url;
        const el = document.createElement('div');
        el.className = 'tab';
        el.dataset.active = t.active ? '1' : '0';
        el.setAttribute('role', 'tab');
        el.title = t.url || '';
        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = t.title || hostOf(t.url) || '新标签页';
        const close = document.createElement('span');
        close.className = 'tab-close';
        close.setAttribute('role', 'button');
        close.setAttribute('aria-label', '关闭标签页');
        close.textContent = '×';
        close.addEventListener('click', (e) => { e.stopPropagation(); invoke('tab_close', { id: t.id }).catch(() => {}); });
        el.append(title, close);
        el.addEventListener('click', () => invoke('tab_activate', { id: t.id }).catch(() => {}));
        tabsScroll.appendChild(el);
        if (t.active) activeUrl = t.url || '';
      });
      if (activeUrl) setOmnibox(activeUrl);
      tabNew.style.display = tabsState.length >= 12 ? 'none' : '';
      // 新激活/新开的 tab 同步编辑态
      pushModeToTab();
      applyBookmarkUI();
    }
    tabNew.addEventListener('click', () => invoke('tab_new', {}).catch(() => {}));

    /* ---- 快捷键 ---- */
    document.addEventListener('keydown', (event) => {
      if (!(event.metaKey || event.ctrlKey)) return;
      const k = event.key.toLowerCase();
      if (k === 't') { event.preventDefault(); invoke('tab_new', {}).catch(() => {}); }
      else if (k === 'w') { event.preventDefault(); const a = tabsState.find((t) => t.active); if (a) invoke('tab_close', { id: a.id }).catch(() => {}); }
      else if (k === 'l') { event.preventDefault(); input.focus(); input.select(); }
      else if (k === 'e') { event.preventDefault(); btnEdit.click(); }
    });

    /* ---- 引擎健康 ---- */
    setTimeout(async () => {
      try {
        const health = await window.vaFetch('GET', 'http://127.0.0.1:8793/api/health');
        engine.dataset.state = health && health.ok ? 'ready' : 'error';
        engineLabel.textContent = health && health.ok ? 'LOCAL' : 'OFFLINE';
      } catch (e) { engine.dataset.state = 'error'; engineLabel.textContent = 'OFFLINE'; }
    }, 450);
  </script>
</body>
</html>
