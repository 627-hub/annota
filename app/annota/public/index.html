<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Annota Browser</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      color:var(--va-text); background:#101114; font:13px/1.4 var(--va-font-ui);
      -webkit-font-smoothing:antialiased; user-select:none;
    }

    /* ============ Row 1 · 标签条 ============ */
    .tabstrip {
      display:flex; align-items:flex-end; gap:2px; width:100%; height:40px; padding:6px 10px 0;
      border-bottom:1px solid rgba(255,255,255,.075); background:#0e0f12;
    }
    .tabs-scroll {
      display:flex; align-items:flex-end; gap:2px; flex:1; min-width:0;
      overflow-x:auto; scrollbar-width:none;
    }
    .tabs-scroll::-webkit-scrollbar { display:none; }

    /* tab：非激活为「斜切」形（同色系一档底），激活为抬起的实心卡片 + 顶部强调条 */
    .tab {
      position:relative; display:flex; align-items:center; gap:7px;
      width:180px; min-width:56px; height:30px; padding:0 7px 0 9px;
      border:1px solid transparent; border-bottom:none; border-radius:9px 9px 0 0;
      background:#16171b; color:#8b9099;
      font:12px var(--va-font-ui); cursor:pointer; white-space:nowrap; flex:none;
      transition:background 140ms var(--va-ease), color 140ms var(--va-ease);
    }
    .tab:hover { background:#1d1e23; color:#c3c7cd; }
    .tab[data-active="1"] {
      background:#22242a; color:#f2f3f5;
      box-shadow:0 -1px 0 rgba(255,255,255,.06) inset;
    }
    /* 激活态：顶部 2px 强调条（贴合标签条上沿，指向导航条，形成"这一页是当前页"的连续感） */
    .tab[data-active="1"]::before {
      content:""; position:absolute; top:0; left:8px; right:8px; height:2px;
      border-radius:0 0 2px 2px; background:var(--va-accent);
    }
    /* 站点色块（无 favicon 时的 fallback） */
    .tab .tab-fav {
      display:grid; place-items:center; width:16px; height:16px; flex:none;
      border-radius:5px; font:700 9px/1 var(--va-font-ui); color:rgba(0,0,0,.62);
      text-transform:uppercase; letter-spacing:0;
    }
    .tab .tab-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .tab .tab-close {
      display:grid; place-items:center; width:17px; height:17px; flex:none;
      border:none; padding:0; border-radius:5px; background:transparent;
      color:#6b7078; cursor:pointer; font:400 13px/1 var(--va-font-ui);
      opacity:.55; transition:opacity 120ms ease, background 120ms ease, color 120ms ease;
    }
    .tab:hover .tab-close { opacity:1; }
    .tab .tab-close:hover { background:rgba(255,255,255,.14); color:#f1f2f3; }
    .tab[data-active="1"] .tab-close { color:#9aa0a8; opacity:.9; }

    /* + 号紧贴 tab 群末尾：给它左分隔线，形成"新建"独立分组感 */
    .tab-new {
      display:grid; place-items:center; width:28px; height:30px; flex:none;
      border:1px solid transparent; border-bottom:none; border-radius:9px 9px 0 0;
      background:transparent; color:#8b9099; cursor:pointer; align-self:flex-end;
      margin-left:4px; padding-left:4px; position:relative;
    }
    .tab-new::before {
      content:""; position:absolute; left:0; top:7px; bottom:6px; width:1px;
      background:rgba(255,255,255,.08);
    }
    .tab-new:hover { background:rgba(255,255,255,.06); color:#f1f2f3; }
    .tab-new svg { width:14px; height:14px; }

    /* ============ Row 2 · 导航条 ============ */
    .toolbar {
      display:flex; align-items:center; gap:10px; width:100%; height:56px; padding:0 13px;
      border-bottom:1px solid rgba(255,255,255,.075); background:#111216;
      box-shadow:0 3px 15px rgba(0,0,0,.12);
    }
    .brand { display:flex; align-items:center; gap:9px; flex:none; color:#f3f3f4; cursor:pointer; }
    .brand:hover .brand-mark { border-color:rgba(245,166,35,.6); background:rgba(245,166,35,.16); }
    .brand-mark {
      position:relative; display:grid; place-items:center; width:31px; height:31px; flex:none;
      border:1px solid rgba(245,166,35,.34); border-radius:10px; background:rgba(245,166,35,.105); color:var(--va-accent);
    }
    .brand-mark svg { width:19px; height:19px; }
    .brand-copy { display:flex; flex-direction:column; min-width:0; line-height:1.15; }
    .brand-name { font-size:13px; font-weight:680; letter-spacing:-.035em; }
    .brand-sub { margin-top:1px; color:#727781; font-size:8px; font-weight:600; letter-spacing:.13em; }

    .nav { display:flex; align-items:center; gap:1px; flex:none; }
    .tool-button {
      display:grid; place-items:center; width:32px; height:32px; padding:0; border:1px solid transparent; border-radius:9px;
      background:transparent; color:#858a93; cursor:pointer; transition:background 120ms ease,color 120ms ease;
    }
    .tool-button:hover:not(:disabled) { background:rgba(255,255,255,.075); color:#f1f2f3; }
    .tool-button:disabled { opacity:.32; cursor:default; }
    .tool-button.is-active { color:var(--va-accent); background:rgba(245,166,35,.13); }
    .tool-button svg { width:16px; height:16px; }

    .omnibox {
      display:flex; align-items:center; gap:9px; min-width:100px; max-width:860px; height:36px; flex:1;
      padding:0 8px 0 11px; border:1px solid rgba(255,255,255,.085); border-radius:11px;
      background:#191a1e; transition:border-color 140ms ease,background 140ms ease,box-shadow 140ms ease;
    }
    .omnibox:focus-within { border-color:rgba(245,166,35,.52); background:#1c1c1f; box-shadow:0 0 0 3px rgba(245,166,35,.08); }
    .site-icon { display:grid; place-items:center; width:19px; height:19px; flex:none; color:#7d838d; }
    .site-icon svg { width:15px; height:15px; }
    #url {
      width:100%; min-width:0; height:32px; padding:0; border:0; outline:0; background:transparent;
      color:#d7d8dc; font:12px var(--va-font-mono); user-select:text;
    }
    #url::placeholder { color:#686d76; font-family:var(--va-font-ui); }
    .go-button {
      display:grid; place-items:center; width:27px; height:27px; flex:none; padding:0; border:0; border-radius:8px;
      background:var(--va-accent); color:#251908; cursor:pointer; transition:filter 120ms ease,transform 120ms ease;
    }
    .go-button:hover { filter:brightness(1.08); }
    .go-button:active { transform:scale(.94); }
    .go-button svg { width:15px; height:15px; }
    .toolbar-separator { width:1px; height:22px; flex:none; background:rgba(255,255,255,.08); }

    .update-pill {
      display:none; align-items:center; gap:7px; flex:none; height:30px; padding:0 11px;
      border:1px solid rgba(245,166,35,.5); border-radius:9px; background:rgba(245,166,35,.14);
      color:#f5c66a; font:600 11px var(--va-font-ui); cursor:pointer; white-space:nowrap;
    }
    .update-pill[data-on="1"] { display:inline-flex; }
    .update-pill:hover { background:rgba(245,166,35,.22); }
    .update-pill .dot { width:6px; height:6px; border-radius:50%; background:var(--va-accent); }
    .update-pill[data-state="busy"] { opacity:.7; pointer-events:none; }

    /* flex:none：状态灯是固定信息位，不能被 omnibox 挤压（否则窄窗口下被裁成半个字母） */
    .engine-state { display:flex; align-items:center; gap:7px; flex:none; min-width:54px; color:#7c828b; font-size:9px; font-weight:600; letter-spacing:.09em; white-space:nowrap; }
    .engine-dot { width:6px; height:6px; border-radius:50%; background:#49bc86; box-shadow:0 0 8px rgba(73,188,134,.35); }
    .engine-state[data-state="error"] .engine-dot { background:#ef7379; box-shadow:0 0 8px rgba(239,115,121,.35); }
    .engine-state[data-state="busy"] .engine-dot { background:var(--va-accent); box-shadow:0 0 8px rgba(245,166,35,.4); }
    .engine-state span:last-child { max-width:76px; overflow:hidden; text-overflow:ellipsis; }


    /* ============ 书签栏（M7） ============ */
    .bookmark-bar {
      display:none; align-items:center; gap:3px; width:100%; height:36px; padding:0 10px;
      border-bottom:1px solid rgba(255,255,255,.06); background:#0f1013;
      overflow-x:auto; scrollbar-width:none;
    }
    .bookmark-bar[data-open="1"] { display:flex; }
    .bookmark-bar::-webkit-scrollbar { display:none; }
    /* 宽度上限 + 单行省略：长标题不再撑爆整行。flex:0 1 auto + max-width，
       使「按内容宽度」与「超长时收缩」同时成立（不用 auto 会让末项拉伸占满剩余空间）。 */
    .bookmark-item {
      display:flex; align-items:center; gap:7px; flex:0 1 auto;
      width:auto; max-width:190px; min-width:0; height:26px; padding:0 10px 0 7px;
      border:1px solid transparent; border-radius:8px;
      background:transparent; color:#a9aeb6;
      font:11.5px var(--va-font-ui); cursor:pointer; white-space:nowrap;
      transition:background 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    .bookmark-item:hover {
      background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.08); color:#f0f1f3;
    }
    .bookmark-item .bm-text {
      flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    /* 站点色块：按域名 hash 取色，比统一图标更有辨识度 */
    .bookmark-item .bm-fav {
      display:grid; place-items:center; width:18px; height:18px; flex:none;
      border-radius:5px; font:700 9px/1 var(--va-font-ui);
      color:rgba(0,0,0,.6); text-transform:uppercase;
    }
    .bookmark-empty {
      display:flex; align-items:center; gap:6px; color:#5a5f68;
      font-size:11.5px; padding:0 8px;
    }

    /* ============ 查找条（M7） ============ */
    .find-bar {
      display:none; align-items:center; gap:8px; position:absolute; top:100px; right:12px; z-index:60;
      height:36px; padding:0 10px; border:1px solid rgba(255,255,255,.12); border-radius:10px;
      background:#1e1f24; box-shadow:0 8px 24px rgba(0,0,0,.4);
    }
    .find-bar[data-open="1"] { display:flex; }
    .find-bar input {
      width:180px; height:28px; padding:0 6px; border:0; outline:0; background:transparent;
      color:#e7e9ec; font:12px var(--va-font-ui);
    }
    .find-bar .find-btn {
      display:grid; place-items:center; width:24px; height:24px; border:0; border-radius:6px;
      background:transparent; color:#8b9099; cursor:pointer;
    }
    .find-bar .find-btn:hover { background:rgba(255,255,255,.08); color:#f1f2f3; }
    .find-bar .find-count { min-width:36px; text-align:center; color:#727781; font:10px var(--va-font-mono); }

    /* ============ omnibox 建议下拉（M6c） ============ */
    .omnibox-wrap { position:relative; flex:1; min-width:100px; max-width:860px; }
    .omnibox-suggestions {
      position:absolute; top:40px; left:0; right:0; z-index:55; display:none; flex-direction:column;
      border:1px solid rgba(255,255,255,.1); border-radius:12px; background:#1a1b1f;
      box-shadow:0 16px 44px rgba(0,0,0,.5); overflow:hidden;
    }
    .omnibox-suggestions[data-open="1"] { display:flex; }
    .omnibox-suggestions .os-item {
      display:flex; align-items:center; gap:9px; padding:9px 12px; cursor:pointer;
      color:#cfd3d9; font:12px var(--va-font-ui);
    }
    .omnibox-suggestions .os-item:hover, .omnibox-suggestions .os-item[data-active="1"] { background:rgba(255,255,255,.07); }
    .omnibox-suggestions .os-icon { width:14px; height:14px; flex:none; color:#7d838d; }
    .omnibox-suggestions .os-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .omnibox-suggestions .os-url { color:#727781; font-size:10px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .omnibox-suggestions .os-search { padding:9px 12px; color:#a9aeb6; font:12px var(--va-font-ui); cursor:pointer; }
    .omnibox-suggestions .os-search:hover { background:rgba(255,255,255,.07); }
    .omnibox-suggestions .os-sep { height:1px; margin:4px 8px; background:rgba(255,255,255,.07); }


    /* 下载提示角标（浮层搬到 overlay.html 后，这里只留「更多」按钮上的小红点） */
    .chrome-dot { display:none; position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--va-accent); box-shadow:0 0 6px rgba(245,166,35,.6); pointer-events:none; }

    button:focus-visible { outline:2px solid var(--va-accent); outline-offset:2px; }

    @media (max-width:720px) {
      .toolbar { gap:7px; padding:0 9px; }
      .brand-copy { display:none; }
      .tab { min-width:0; max-width:40px; padding:0; justify-content:center; }
      .tab .tab-title, .tab .tab-close { display:none; }
      .engine-state { display:none; }
    }
  </style>
</head>
<body>
  <!-- Row 1 · 标签条 -->
  <div class="tabstrip" id="tabstrip" role="tablist" aria-label="标签页">
    <div class="tabs-scroll" id="tabs-scroll"></div>
    <button class="tab-new" id="tab-new" type="button" aria-label="新建标签页" title="新建标签页 (⌘T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <!-- 书签栏（M7） -->
  <div class="bookmark-bar" id="bookmark-bar" data-open="0"></div>

  <!-- Row 2 · 导航条 -->
  <header class="toolbar" role="toolbar" aria-label="Annota 浏览器导航">
    <div class="brand" id="home-button" role="button" tabindex="0" aria-label="Annota 首页" title="打开 Annota 首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 19 7.5-14 7.5 14M8.2 13.2h7.6"/><path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4" opacity=".55"/></svg>
      </span>
      <span class="brand-copy"><span class="brand-name">Annota</span><span class="brand-sub">CONTENT BROWSER</span></span>
    </div>
    <nav class="nav" aria-label="页面导航">
      <button class="tool-button" id="btn-back" type="button" aria-label="后退" title="后退" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg></button>
      <button class="tool-button" id="btn-forward" type="button" aria-label="前进" title="前进" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 5 7 7-7 7"/></svg></button>
      <button class="tool-button" id="btn-reload" type="button" aria-label="刷新" title="刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.8 9a7 7 0 0 1 11.7-2L20 12M4 12l2.5 5a7 7 0 0 0 11.7-2"/></svg></button>
    </nav>
    <div class="omnibox-wrap">
      <form class="omnibox" id="nav-form">
        <span class="site-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span>
        <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="搜索或输入网址" aria-label="搜索或输入网址" />
        <button class="go-button" type="submit" aria-label="打开网址" title="打开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
      </form>
      <div class="omnibox-suggestions" id="omnibox-suggestions" data-open="0"></div>
    </div>
    <button class="tool-button" id="btn-bookmark" type="button" aria-label="收藏" title="收藏此页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg></button>
    <button class="tool-button" id="btn-bookmark-bar" type="button" aria-label="书签栏" title="切换书签栏 (⌘⇧B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
    <button class="tool-button" id="btn-find" type="button" aria-label="查找" title="页面内查找 (⌘F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></button>
    <button class="tool-button" id="btn-edit" type="button" aria-label="编辑" title="进入编辑（侧栏）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 5l4 4"/></svg></button>
    <button class="update-pill" id="update-pill" type="button" title="" aria-label="安装更新"><i class="dot"></i><span id="update-label">有新版本</span></button>
    <span class="toolbar-separator"></span>
    <span class="tool-menu-wrap">
      <button class="tool-button" id="btn-menu" type="button" aria-label="更多" title="更多"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
      <i class="chrome-dot" id="dl-dot"></i>
    </span>
    <div class="engine-state" id="engine-state" data-state="ready" role="status" aria-live="polite"><i class="engine-dot"></i><span id="engine-label">LOCAL</span></div>
  </header>

  <!-- 查找条（M7） -->
  <div class="find-bar" id="find-bar" data-open="0">
    <input id="find-input" type="text" placeholder="查找…" aria-label="查找" />
    <span class="find-count" id="find-count"></span>
    <button class="find-btn" id="find-prev" aria-label="上一个" title="上一个"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
    <button class="find-btn" id="find-next" aria-label="下一个" title="下一个"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="find-btn" id="find-close" aria-label="关闭" title="关闭 (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>


  <script>
    const input = document.getElementById('url');
    const form = document.getElementById('nav-form');
    const engine = document.getElementById('engine-state');
    const engineLabel = document.getElementById('engine-label');
    const WORKSPACE = 'http://127.0.0.1:8793/';
    function tauri() { return window.__TAURI_INTERNALS__ || window.__TAURI__; }
    function invoke(cmd, args) {
      const t = tauri();
      if (!t || !t.invoke) throw new Error('Annota bridge 不可用');
      return t.invoke(cmd, args);
    }

    /* ---- 导航 ---- */
    async function navigate(raw) {
      const value = (raw != null ? raw : input.value).trim();
      if (!value) return;
      engine.dataset.state = 'busy'; engineLabel.textContent = 'OPENING';
      try {
        await invoke('navigate_browser', { url: value });
        engine.dataset.state = 'ready'; engineLabel.textContent = 'LOCAL';
      } catch (e) { engine.dataset.state = 'error'; engineLabel.textContent = 'ERROR'; }
    }
    form.addEventListener('submit', (e) => { e.preventDefault(); navigate(); });
    input.addEventListener('focus', () => input.select());
    document.getElementById('btn-back').addEventListener('click', () => invoke('browser_action', { action: 'back' }).catch(() => {}));
    document.getElementById('btn-forward').addEventListener('click', () => invoke('browser_action', { action: 'forward' }).catch(() => {}));
    document.getElementById('btn-reload').addEventListener('click', () => invoke('browser_action', { action: 'reload' }).catch(() => {}));
    function openHome() { navigate(WORKSPACE); }
    document.getElementById('home-button').addEventListener('click', openHome);
    document.getElementById('home-button').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openHome(); } });

    /* ---- 编辑态切换（观看 ↔ 编辑）---- */
    let shellMode = 'view';
    const btnEdit = document.getElementById('btn-edit');
    function applyEditUI() {
      const on = shellMode === 'edit';
      btnEdit.classList.toggle('is-active', on);
      btnEdit.setAttribute('title', on ? '退出编辑' : '进入编辑（侧栏）');
      try { localStorage.setItem('va.browser.shellMode', shellMode); } catch (e) {}
    }
    try { shellMode = localStorage.getItem('va.browser.shellMode') === 'edit' ? 'edit' : 'view'; } catch (e) {}
    btnEdit.addEventListener('click', () => {
      shellMode = shellMode === 'edit' ? 'view' : 'edit';
      applyEditUI();
      invoke('set_shell_mode', { mode: shellMode }).catch(() => {});
    });
    applyEditUI();
    // 进入编辑后，新激活/新开的 tab 也要同步态
    function pushModeToTab() { invoke('set_shell_mode', { mode: shellMode }).catch(() => {}); }

    /* ---- 下拉浮层（M7 重做）：菜单 / 历史 / 下载都在独立 overlay webview 里，
       工具栏只负责调 overlay_open。这样打开浮层不会增高工具栏、页面也不会下移。 ---- */
    const btnMenu = document.getElementById('btn-menu');
    const dlDot = document.getElementById('dl-dot');
    const API = 'http://127.0.0.1:8793';
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmtAgo(ms) {
      const d = Date.now() - ms;
      if (d < 60000) return '刚刚';
      const m = d / 60000; if (m < 60) return Math.floor(m) + ' 分钟前';
      const h = m / 60; if (h < 24) return Math.floor(h) + ' 小时前';
      const dd = h / 24; if (dd < 30) return Math.floor(dd) + ' 天前';
      try { return new Date(ms).toLocaleDateString(); } catch (e) { return ''; }
    }

    btnMenu.addEventListener('click', () => invoke('overlay_open', { kind: 'menu' }).catch(() => {}));

    /* ---- 收藏星标（M6 接后端） ---- */
    const btnBookmark = document.getElementById('btn-bookmark');
    let bookmarkUrls = new Set();
    function activeTab() { return tabsState.find((t) => t.active); }
    function activeUrl() { const a = activeTab(); if (!a) return ''; return tabUrlCache[a.id] || a.url || ''; }
    function applyBookmarkUI() {
      const url = activeUrl();
      const on = !!url && bookmarkUrls.has(url);
      btnBookmark.classList.toggle('is-active', on);
      btnBookmark.setAttribute('title', on ? '已收藏' : '收藏此页');
    }
    async function refreshBookmarks() {
      try {
        const r = await window.vaFetch('GET', API + '/api/bookmarks');
        if (!(r && r.ok)) return; // 请求失败不清空本地状态（避免星标全灭）
        const arr = (r.json && r.json.bookmarks) || [];
        bookmarkUrls = new Set(arr.map((b) => b.url));
        applyBookmarkUI();
      } catch (e) {}
    }
    btnBookmark.addEventListener('click', async () => {
      const a = activeTab(); const url = activeUrl();
      if (!a || !url) return;
      try {
        if (bookmarkUrls.has(url)) {
          const r = await window.vaFetch('DELETE', API + '/api/bookmarks?url=' + encodeURIComponent(url));
          if (r && r.ok) bookmarkUrls.delete(url);
        } else {
          const r = await window.vaFetch('POST', API + '/api/bookmarks', { url: url, title: a.title || hostOf(url) });
          if (r && r.ok) bookmarkUrls.add(url);
        }
      } catch (e) {}
      applyBookmarkUI();
    });
    refreshBookmarks();
    setTimeout(refreshBookmarks, 900);

    /* ---- 自动更新 ---- */
    const updatePill = document.getElementById('update-pill');
    const updateLabel = document.getElementById('update-label');
    function onUpdateAvailable(payload) {
      const v = (payload && payload.version) || '';
      updateLabel.textContent = v ? ('更新到 ' + v) : '有新版本';
      updatePill.setAttribute('title', '点击下载并安装 Annota ' + v + '（安装后自动重启）');
      updatePill.dataset.on = '1';
    }
    updatePill.addEventListener('click', async () => {
      updatePill.dataset.state = 'busy'; updateLabel.textContent = '正在下载…';
      try { await invoke('install_update'); }
      catch (e) { updatePill.dataset.state = ''; updateLabel.textContent = '更新失败，重试'; updatePill.setAttribute('title', String((e && e.message) || e)); }
    });

    /* ---- 事件订阅 ---- */
    (function subscribe() {
      const t = tauri();
      const listen = (t && t.event && typeof t.event.listen === 'function')
        ? t.event.listen.bind(t.event)
        : null;
      window.__TOOLBAR_EVENTS__ = [];
      if (listen) {
        console.log('[annota-toolbar] event bridge ok');
      } else {
        // 没有事件桥时仍要能渲染 tab：退回 Rust 主动推送（annota://tabs-changed 的 HTTP 兜底）。
        console.warn('[annota-toolbar] 事件桥不可用，tab 列表改用轮询兜底');
      }
      const on = (name, fn) => {
        if (listen) { try { listen('annota://' + name, fn); } catch (e) { console.warn('listen failed ' + name, e); } }
        else { window.__TOOLBAR_EVENTS__.push('poll:' + name); }
      };
      window.__TOOLBAR_EVENTS__ = [];

      on('update-available', (ev) => onUpdateAvailable(ev.payload));
      on('tabs-changed', (ev) => renderTabs((ev.payload && ev.payload.tabs) || []));
      on('tab-updated', (ev) => {
        const p = ev.payload || {};
        if (!p.id) return;
        if (p.url) tabUrlCache[p.id] = p.url;
        if (p.active) setOmnibox(tabUrlCache[p.id]);
        document.getElementById('btn-reload').classList.toggle('is-active', !!p.loading);
        applyBookmarkUI();
      });
      on('download-started', () => { dlDot.style.display = 'block'; });
      on('download-finished', () => { dlDot.style.display = 'none'; });
      // 内容 webview 内切换编辑态（如 Cmd/Ctrl+E）→ 同步工具栏按钮
      on('shell-mode-changed', (ev) => {
        const m = ev.payload && ev.payload.mode === 'edit' ? 'edit' : 'view';
        if (m !== shellMode) { shellMode = m; applyEditUI(); }
      });

      // 无事件桥时的兜底：轮询 Rust 拿 tab 快照（tabs_snapshot 走 invoke，不依赖事件）
      if (!listen) {
        const poll = async () => {
          try {
            const r = await invoke('tabs_snapshot');
            if (r && r.tabs) renderTabs(r.tabs);
          } catch (e) {}
        };
        setTimeout(poll, 500);
        setInterval(poll, 1500);
      }
    })();

    /* ---- 标签页 ---- */
    const tabsScroll = document.getElementById('tabs-scroll');
    const tabNew = document.getElementById('tab-new');
    const tabUrlCache = {};
    let tabsState = [];
    function hostOf(u) { try { return new URL(u).host.replace(/^www\./, '') || u; } catch (e) { return u || ''; } }
    function setOmnibox(u) { if (u && document.activeElement !== input) input.value = u; }

    /* 站点色块：无 favicon 时的 fallback。取域名 hash → 稳定色相，辨识度比统一图标高。
       不拉跨域图片，避免加载失败与性能开销。 */
    const SITE_HUES = [8, 32, 45, 96, 142, 168, 190, 212, 232, 262, 292, 330];
    function siteTile(url) {
      const host = hostOf(url) || '';
      const key = host.split('.')[0] || '?';
      let h = 0;
      for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
      const hue = SITE_HUES[h % SITE_HUES.length];
      const el = document.createElement('span');
      el.className = 'bm-fav';
      el.setAttribute('aria-hidden', 'true');
      el.style.background = `hsl(${hue} 62% 58%)`;
      el.textContent = key.slice(0, 1) || '·';
      return el;
    }

    function renderTabs(tabs) {
      tabsState = tabs || [];
      Array.from(tabsScroll.querySelectorAll('.tab')).forEach((n) => n.remove());
      let activeUrl = '';
      tabsState.forEach((t) => {
        if (t.url) tabUrlCache[t.id] = t.url;
        const label = t.title || hostOf(t.url) || '新标签页';
        const el = document.createElement('div');
        el.className = 'tab';
        el.dataset.active = t.active ? '1' : '0';
        el.setAttribute('role', 'tab');
        el.title = t.url || label;
        const fav = siteTile(t.url || '');
        fav.className = 'tab-fav';
        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = label;
        const close = document.createElement('button');
        close.className = 'tab-close';
        close.setAttribute('aria-label', '关闭标签页');
        close.textContent = '×';
        close.addEventListener('click', (e) => { e.stopPropagation(); invoke('tab_close', { id: t.id }).catch(() => {}); });
        el.append(fav, title, close);
        el.addEventListener('click', () => invoke('tab_activate', { id: t.id }).catch(() => {}));
        tabsScroll.appendChild(el);
        if (t.active) activeUrl = t.url || '';
      });
      if (activeUrl) setOmnibox(activeUrl);
      tabNew.style.display = tabsState.length >= 12 ? 'none' : '';
      // 新激活/新开的 tab 同步编辑态
      pushModeToTab();
      applyBookmarkUI();
    }
    tabNew.addEventListener('click', () => invoke('tab_new', {}).catch(() => {}));

    /* ---- 书签栏（M7） ---- */
    const bookmarkBar = document.getElementById('bookmark-bar');
    const btnBookmarkBar = document.getElementById('btn-bookmark-bar');
    function applyBookmarkBarUI() {
      const on = bookmarkBar.dataset.open === '1';
      btnBookmarkBar.classList.toggle('is-active', on);
    }
    async function renderBookmarkBar() {
      let rows = [];
      try {
        const r = await window.vaFetch('GET', API + '/api/bookmarks');
        if (r && r.ok && r.json) rows = r.json.bookmarks || [];
      } catch (e) {}
      if (!bookmarkBar.dataset.open) return;
      if (!rows.length) {
        bookmarkBar.innerHTML = '<span class="bookmark-empty">' +
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7">' +
          '<path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>暂无收藏 · 按 ⌘⇧B 隐藏</span>';
        return;
      }
      bookmarkBar.innerHTML = '';
      rows.forEach((b) => {
        const label = b.title || hostOf(b.url);
        const el = document.createElement('div');
        el.className = 'bookmark-item';
        el.dataset.url = b.url;
        el.title = label + '\n' + b.url;   // 省略号之外保留完整信息
        el.appendChild(siteTile(b.url || ''));
        const text = document.createElement('span');
        text.className = 'bm-text';
        text.textContent = label;
        el.appendChild(text);
        el.addEventListener('click', () => navigate(el.dataset.url));
        bookmarkBar.appendChild(el);
      });
    }
    btnBookmarkBar.addEventListener('click', () => {
      bookmarkBar.dataset.open = bookmarkBar.dataset.open === '1' ? '0' : '1';
      applyBookmarkBarUI();
      if (bookmarkBar.dataset.open === '1') renderBookmarkBar();
      reportToolbarHeight();
    });
    try { bookmarkBar.dataset.open = localStorage.getItem('va.browser.bookmarkBar') === '1' ? '1' : '0'; } catch (e) {}
    btnBookmarkBar.addEventListener('click', () => {
      try { localStorage.setItem('va.browser.bookmarkBar', bookmarkBar.dataset.open); } catch (e) {}
    });
    applyBookmarkBarUI();

    /* ---- 查找条（M7） ---- */
    const findBar = document.getElementById('find-bar');
    const findInput = document.getElementById('find-input');
    const findCount = document.getElementById('find-count');
    function openFindBar() {
      findBar.dataset.open = '1';
      findInput.focus();
      findInput.select();
    }
    function closeFindBar() {
      findBar.dataset.open = '0';
      invoke('find_in_page', { text: '', forward: true }).catch(() => {});
    }
    document.getElementById('btn-find').addEventListener('click', () => {
      if (findBar.dataset.open === '1') closeFindBar(); else openFindBar();
    });
    document.getElementById('find-close').addEventListener('click', closeFindBar);
    document.getElementById('find-next').addEventListener('click', () => {
      invoke('find_in_page', { text: findInput.value, forward: true }).catch(() => {});
    });
    document.getElementById('find-prev').addEventListener('click', () => {
      invoke('find_in_page', { text: findInput.value, forward: false }).catch(() => {});
    });
    findInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        invoke('find_in_page', { text: findInput.value, forward: !e.shiftKey }).catch(() => {});
      } else if (e.key === 'Escape') {
        closeFindBar();
      }
    });

    /* 缩放已随菜单搬进 overlay.html；工具栏只保留 ⌘+ / ⌘− / ⌘0 快捷键。 */
    let zoomFactor = 1.0;
    try { zoomFactor = parseFloat(localStorage.getItem('va.browser.zoom')) || 1.0; } catch (e) {}
    function zoomBy(delta) {
      zoomFactor = Math.min(5.0, Math.max(0.25, +(zoomFactor + delta).toFixed(2)));
      invoke('set_zoom', { factor: zoomFactor }).catch(() => {});
      try { localStorage.setItem('va.browser.zoom', String(zoomFactor)); } catch (e) {}
    }

    /* ---- omnibox 智能搜索（M6c） ---- */
    const suggestions = document.getElementById('omnibox-suggestions');
    let suggActive = -1;
    let suggItems = [];
    async function fetchSuggestions(q) {
      try {
        const r = await window.vaFetch('GET', API + '/api/omnibox?q=' + encodeURIComponent(q));
        if (r && r.ok && r.json) return r.json.result || {};
      } catch (e) {}
      return {};
    }
    function renderSuggestions(result, q) {
      const history = result.history || [];
      const bookmarks = result.bookmarks || [];
      suggItems = [];
      suggActive = -1;
      if (!history.length && !bookmarks.length && !q) {
        suggestions.dataset.open = '0';
        return;
      }
      let html = '';
      if (bookmarks.length) {
        html += '<div class="os-sep"></div>';
        bookmarks.forEach((b) => {
          html += '<div class="os-item" data-url="' + esc(b.url) + '">' +
            '<svg class="os-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>' +
            '<span class="os-title">' + esc(b.title || hostOf(b.url)) + '</span>' +
            '<span class="os-url">' + esc(b.url) + '</span></div>';
          suggItems.push({ url: b.url });
        });
      }
      if (history.length) {
        html += '<div class="os-sep"></div>';
        history.forEach((h) => {
          html += '<div class="os-item" data-url="' + esc(h.url) + '">' +
            '<svg class="os-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>' +
            '<span class="os-title">' + esc(h.title || hostOf(h.url)) + '</span>' +
            '<span class="os-url">' + esc(h.url) + '</span></div>';
          suggItems.push({ url: h.url });
        });
      }
      if (q) {
        html += '<div class="os-sep"></div>';
        html += '<div class="os-search" data-search="' + esc(q) + '">搜索「' + esc(q) + '」</div>';
        suggItems.push({ search: q });
      }
      suggestions.innerHTML = html;
      suggestions.dataset.open = '1';
      suggestions.querySelectorAll('.os-item').forEach((el, i) => {
        el.addEventListener('click', () => { navigate(el.dataset.url); suggestions.dataset.open = '0'; });
      });
      suggestions.querySelectorAll('.os-search').forEach((el) => {
        el.addEventListener('click', () => { navigate(el.dataset.search); suggestions.dataset.open = '0'; });
      });
    }
    let suggTimer = null;
    input.addEventListener('input', () => {
      clearTimeout(suggTimer);
      const q = input.value.trim();
      if (!q) { suggestions.dataset.open = '0'; return; }
      suggTimer = setTimeout(async () => {
        const result = await fetchSuggestions(q);
        renderSuggestions(result, q);
      }, 150);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' && suggestions.dataset.open === '1') {
        e.preventDefault();
        suggActive = Math.min(suggItems.length - 1, suggActive + 1);
        suggestions.querySelectorAll('.os-item,.os-search').forEach((el, i) => el.dataset.active = i === suggActive ? '1' : '0');
      } else if (e.key === 'ArrowUp' && suggestions.dataset.open === '1') {
        e.preventDefault();
        suggActive = Math.max(0, suggActive - 1);
        suggestions.querySelectorAll('.os-item,.os-search').forEach((el, i) => el.dataset.active = i === suggActive ? '1' : '0');
      } else if (e.key === 'Escape') {
        suggestions.dataset.open = '0';
      }
    });
    document.addEventListener('click', (e) => {
      if (!suggestions.contains(e.target) && e.target !== input) suggestions.dataset.open = '0';
    });

    /* ---- 工具栏高度上报（M7） ---- */
    function reportToolbarHeight() {
      const h = document.querySelector('.tabstrip').offsetHeight +
        (bookmarkBar.dataset.open === '1' ? bookmarkBar.offsetHeight : 0) +
        document.querySelector('.toolbar').offsetHeight;
      invoke('set_toolbar_height', { height: h }).catch(() => {});
    }
    window.addEventListener('resize', reportToolbarHeight);
    setTimeout(reportToolbarHeight, 100);
    setTimeout(reportToolbarHeight, 500);

    /* ---- 快捷键 ---- */
    document.addEventListener('keydown', (event) => {
      if (!(event.metaKey || event.ctrlKey)) return;
      const k = event.key.toLowerCase();
      if (k === 't') { event.preventDefault(); invoke('tab_new', {}).catch(() => {}); }
      else if (k === 'w') { event.preventDefault(); const a = tabsState.find((t) => t.active); if (a) invoke('tab_close', { id: a.id }).catch(() => {}); }
      else if (k === 'l') { event.preventDefault(); input.focus(); input.select(); }
      else if (k === 'e') { event.preventDefault(); btnEdit.click(); }
      else if (k === 'f') { event.preventDefault(); if (findBar.dataset.open === '1') closeFindBar(); else openFindBar(); }
      else if (k === 'b' && event.shiftKey) { event.preventDefault(); btnBookmarkBar.click(); }
      else if (k === '0' && event.metaKey) { event.preventDefault(); zoomFactor = 1.0; invoke('set_zoom', { factor: 1.0 }).catch(() => {}); try { localStorage.setItem('va.browser.zoom', '1'); } catch (e) {} }
      else if (k === '+' || k === '=') { event.preventDefault(); zoomBy(0.1); }
      else if (k === '-') { event.preventDefault(); zoomBy(-0.1); }
    });

    /* ---- 引擎健康 ---- */
    setTimeout(async () => {
      try {
        const health = await window.vaFetch('GET', 'http://127.0.0.1:8793/api/health');
        engine.dataset.state = health && health.ok ? 'ready' : 'error';
        engineLabel.textContent = health && health.ok ? 'LOCAL' : 'OFFLINE';
      } catch (e) { engine.dataset.state = 'error'; engineLabel.textContent = 'OFFLINE'; }
    }, 450);
  </script>
</body>
