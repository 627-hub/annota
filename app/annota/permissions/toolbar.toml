[[permission]]
identifier = "allow-overlay"
description = "Allows the toolbar to open/close the dropdown overlay webview (menu, history, downloads)."
commands.allow = ["overlay_open", "overlay_close", "tabs_snapshot"]

[[permission]]
identifier = "allow-set-toolbar-height"
description = "Allows the toolbar to report its measured height so the shell can lay out the browser content area."
commands.allow = ["set_toolbar_height"]
[[permission]]
identifier = "allow-diag-status"
description = "Allows the toolbar to read local server/database diagnostics (bind failure reason, memory-db degrade) and retry starting the local sync server."
commands.allow = ["diag_status", "restart_server"]

[[permission]]
identifier = "allow-trust-current-site"
description = "Allows the toolbar to add the active tab's origin to the trusted-sites list (S1 guard for high-risk commands)."
commands.allow = ["trust_current_site"]
